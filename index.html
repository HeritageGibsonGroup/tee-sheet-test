  }

  async function importPastedSnapshot(){
    const pasted = await askLongText('Import data snapshot', 'Paste a snapshot copied from an "Export data snapshot" button — or a partial update, like a duty-only file.');
    if(pasted === null) return;
    const trimmed = pasted.trim();
    if(!trimmed) return;
    let incoming;
    try{ incoming = JSON.parse(trimmed); }
    catch(e){ await showMessage('Import failed', "That doesn't look like a valid snapshot — make sure you copied the whole thing."); return; }

    const nameToId = {};
    data.roster.forEach(p => { nameToId[p.name.trim().toLowerCase()] = p.id; });

    // Merge in any new roster names (never removes existing players). Reuse the id
    // from the incoming file when it has one — that's what makes it match the duty and
    // signup entries in the same file. Only generate a fresh id if none was provided.
    let addedPlayers = 0;
    let updatedEmails = 0;
    let updatedHandicaps = 0;
    if(Array.isArray(incoming.roster)){
      incoming.roster.forEach(entry => {
        const name = (entry && typeof entry === 'object') ? entry.name : entry;
        if(!name) return;
        const key = String(name).trim().toLowerCase();
        const email = (entry && typeof entry === 'object' && entry.email) ? entry.email : null;
        const handicapIndex = (entry && typeof entry === 'object' && typeof entry.handicapIndex === 'number') ? entry.handicapIndex : null;
        const courseHandicaps = (entry && typeof entry === 'object' && entry.courseHandicaps && typeof entry.courseHandicaps === 'object') ? entry.courseHandicaps : null;
        if(!nameToId[key]){
          const id = (entry && typeof entry === 'object' && entry.id) ? entry.id : ('p_' + Date.now() + '_' + Math.random().toString(36).slice(2,7));
          const newEntry = { id, name: String(name) };
          if(email) newEntry.email = email;
          if(handicapIndex !== null) newEntry.handicapIndex = handicapIndex;
          if(courseHandicaps) newEntry.courseHandicaps = courseHandicaps;
          data.roster.push(newEntry);
          nameToId[key] = id;
          addedPlayers++;
        } else {
          const existing = data.roster.find(p => p.id === nameToId[key]);
          if(existing && email && existing.email !== email){
            existing.email = email;
            updatedEmails++;
          }
          if(existing && (handicapIndex !== null || courseHandicaps)){
            if(handicapIndex !== null) existing.handicapIndex = handicapIndex;
            if(courseHandicaps) existing.courseHandicaps = courseHandicaps;
            updatedHandicaps++;
          }
        }
      });
    }

    // Merge in signups (id-based, from a full snapshot) — adds only, never clobbers an existing choice
    let addedSignups = 0;
    if(incoming.signups && typeof incoming.signups === 'object'){
      Object.keys(incoming.signups).forEach(dateKey => {
        const entries = incoming.signups[dateKey];
        if(!Array.isArray(entries)) return;
        const list = data.signups[dateKey] || (data.signups[dateKey] = []);
        entries.forEach(e => {
          if(!e || !e.id) return;
          if(list.some(x => x.id === e.id)) return;
          list.push({ id: e.id, holes: HOLES_CYCLE.includes(e.holes) ? e.holes : '18' });
          addedSignups++;
        });
      });
    }

    // Merge in duty assignments — id-based (from a full snapshot) or name-based (from a
    // duty-only spreadsheet export). Each date present in the update overwrites just that
    // date; every other date's assignment is left untouched.
    let updatedDuty = 0;
    const unmatchedNames = [];
    if(incoming.duty && typeof incoming.duty === 'object'){
      Object.keys(incoming.duty).forEach(dateKey => {
        data.duty[dateKey] = incoming.duty[dateKey];
        updatedDuty++;
      });
    }
    if(incoming.dutyByName && typeof incoming.dutyByName === 'object'){
      Object.keys(incoming.dutyByName).forEach(dateKey => {
        const name = incoming.dutyByName[dateKey];
        const id = nameToId[String(name).trim().toLowerCase()];
        if(id){
          data.duty[dateKey] = id;
          updatedDuty++;
        } else {
          unmatchedNames.push(name);
        }
      });
    }

    if(incoming.closures && typeof incoming.closures === 'object'){
      Object.keys(incoming.closures).forEach(dateKey => {
        data.closures[dateKey] = incoming.closures[dateKey];
      });
    }

    if(incoming.confirmedTeeTimes && typeof incoming.confirmedTeeTimes === 'object'){
      Object.keys(incoming.confirmedTeeTimes).forEach(dateKey => {
        data.confirmedTeeTimes[dateKey] = incoming.confirmedTeeTimes[dateKey];
      });
    }

    if(incoming.teeTimeSchedule && typeof incoming.teeTimeSchedule === 'object'){
      Object.keys(incoming.teeTimeSchedule).forEach(dateKey => {
        data.teeTimeSchedule[dateKey] = incoming.teeTimeSchedule[dateKey];
      });
    }

    if(incoming.teeRatings && typeof incoming.teeRatings === 'object'){
      Object.keys(incoming.teeRatings).forEach(teeName => {
        data.teeRatings[teeName] = incoming.teeRatings[teeName];
      });
    }
    if(Array.isArray(incoming.teeOptions) && incoming.teeOptions.length){
      data.teeOptions = incoming.teeOptions;
    }

    // Hole handicaps (stroke index): course-wide, keyed by hole number — a
    // one-time setup import, so any hole present in the pasted file overwrites
    // that hole's rank; holes not mentioned are left as they were.
    let updatedHoleHandicaps = 0;
    if(incoming.holeHandicaps && typeof incoming.holeHandicaps === 'object'){
      Object.keys(incoming.holeHandicaps).forEach(h => {
        const n = parseInt(h, 10);
        const rank = incoming.holeHandicaps[h];
        if(n >= 1 && n <= 18 && typeof rank === 'number' && rank >= 1 && rank <= 18){
          data.holeHandicaps[String(n)] = rank;
          updatedHoleHandicaps++;
        }
      });
    }

    normalizeSignups();
    if(updatedHandicaps > 0) data.handicapUpdatedAt = Date.now();
    await saveData();
    let msg = `Added ${addedPlayers} new player${addedPlayers===1?'':'s'}, updated ${updatedEmails} email${updatedEmails===1?'':'s'}, updated ${updatedHandicaps} handicap${updatedHandicaps===1?'':'s'}, ${addedSignups} new signup${addedSignups===1?'':'s'}, updated ${updatedDuty} booking-duty assignment${updatedDuty===1?'':'s'}, and updated ${updatedHoleHandicaps} hole handicap${updatedHoleHandicaps===1?'':'s'}.`;
    if(unmatchedNames.length){
      msg += ` Couldn't match: ${[...new Set(unmatchedNames)].join(', ')} — check they're spelled the same as in the roster.`;
    }
    await showMessage('Imported', msg);
  }

  function render(){
    if(activeSection === 'admin' && !isAdmin) activeSection = 'schedule';
    if(data.roster.length === 0 && activeSection !== 'roster'){
      root.innerHTML = `
        ${testBannerHtml()}
        ${storageAvailable ? '' : warnBannerHtml()}
        <div class="ts-header">
          <p class="ts-eyebrow">Tee Sheet</p>
          <h1 class="ts-title">Set up your roster</h1>
          <p class="ts-sub">Add players by hand, or pull in a snapshot of the live app's current roster and signups below. You'll set an admin PIN the first time — keep it, you'll need it to edit the roster or booking duty later.</p>
        </div>
        <div class="ts-body">
          <div id="ts-roster-panel"></div>
        </div>`;
      renderRosterPanel(document.getElementById('ts-roster-panel'));
      wireRosterPanel();
      return;
    }

    const schedule = buildSchedule();
    lastSchedule = schedule;
    const today = new Date(); today.setHours(0,0,0,0);
    const tomorrowKey = (() => { const t = new Date(today); t.setDate(t.getDate()+1); return fmtDateKey(t); })();

    // Reminders
    const reminders = [];
    if(meId){
      const meName = (data.roster.find(p=>p.id===meId)||{}).name;
      if(meName){
        const tmrDate = schedule.find(d => fmtDateKey(d) === tomorrowKey);
        if(tmrDate){
          const mySignup = findSignup(tomorrowKey, meId);
          if(mySignup){
            const suffix = mySignup.holes === '18' ? '' : ` (${HOLES_LABEL[mySignup.holes]})`;
            reminders.push(`<div class="ts-reminder"><span class="flag">⛳</span><div><b>You're playing tomorrow</b> — ${DOW_NAMES[tmrDate.getDay()]}, ${MON_NAMES[tmrDate.getMonth()]} ${tmrDate.getDate()}${suffix}.</div></div>`);
          }
        }
      }
      schedule.forEach((d) => {
        const duty = dutyForKey(fmtDateKey(d));
        if(duty && duty.id === meId && !data.closures[fmtDateKey(d)]){
          const bookOpenDate = new Date(d); bookOpenDate.setDate(bookOpenDate.getDate() - BOOKING_WINDOW_DAYS);
          if(daysBetween(today, bookOpenDate) === 0){
            const count = (data.signups[fmtDateKey(d)]||[]).length;
            const tt = count > 0 ? Math.ceil(count/PLAYERS_PER_TEE_TIME) : 0;
            const arrival = arrivalTimeFor(fmtDateKey(bookOpenDate));
            const arrivalPhrase = arrival ? `at ${arrival}` : '(time varies by season)';
            reminders.push(`<div class="ts-reminder"><span class="flag">🏌️</span><div>Head to the pro shop today ${arrivalPhrase} and request ${tt || '?'} tee time${tt===1?'':'s'} for ${DOW_NAMES[d.getDay()]}, ${MON_NAMES[d.getMonth()]} ${d.getDate()}.</div></div>`);
          }

    } else {

    }

    const me = data.roster.find(p => p.id === meId);
    const meHasPin = me && data.playerPins[me.id];

    let html = `
      ${testBannerHtml()}
        ${storageAvailable ? '' : warnBannerHtml()}
      <div class="ts-header">
        <h1 class="ts-title">Heritage Gibson Group</h1>
        <p class="ts-eyebrow">
          ${data.roster.length} Player${data.roster.length===1?'':'s'}
          <button class="ts-admin-pill ${isAdmin?'on':''}" id="ts-admin-pill">${isAdmin ? '🔓 Admin unlocked' : '🔒 Admin'}</button>
        </p>
        <p class="ts-version">Updated ${VERSION_DATE}</p>
        <p class="ts-sub">Pick your dates below — and if you can only play 9, say so. Booking duty is set by the league admin; the club opens tee time booking ${BOOKING_WINDOW_DAYS} days out.</p>
      </div>
      <div class="ts-body">
        <div class="ts-whoami">
          <label>I'm —</label>
          <select id="ts-who-select">
            <option value="">Select your name</option>
            ${sortedRoster().map(p => `<option value="${p.id}" ${p.id===meId?'selected':''}>${esc(p.name)}</option>`).join('')}
          </select>
        </div>
        ${me ? `<div style="margin-top:6px;"><button class="ts-pin-link" id="ts-set-pin">${meHasPin ? 'Change my PIN' : 'Protect my signups with a PIN'}</button></div>` : ''}
        ${me && data.teeOptions.length ? `
          <div style="margin-top:8px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;">

            <select id="ts-my-default-tee" style="font-family:'Inter'; font-size:13px; padding:6px 10px; border-radius:7px; border:1px solid var(--ivory-line);">
              <option value="">Not set</option>
              ${data.teeOptions.map(tee => `<option value="${esc(tee)}" ${me.defaultTee===tee?'selected':''}>${esc(tee)}</option>`).join('')}
            </select>
          </div>` : ''}
        ${reminders.length ? `<div class="ts-reminders">${reminders.join('')}</div>` : ''}

        <div class="ts-tabbar">
          ${isAdmin ? `
          <button class="ts-tab ${activeSection==='admin'?'active':''}" data-tab="admin">
            <span class="ts-tab-icon">⚙️</span><span class="ts-tab-label">Admin</span>
          </button>` : ''}
          <button class="ts-tab ${activeSection==='schedule'?'active':''}" data-tab="schedule">
            <span class="ts-tab-icon">📅</span><span class="ts-tab-label">Upcoming dates</span>
          </button>

        ${activeSection === 'admin' ? `

            <button class="ts-subtab ${adminSubTab==='data'?'active':''}" data-subtab="data">Data Import/Export &amp; Comparison</button>

            <button class="ts-subtab ${adminSubTab==='scoring'?'active':''}" data-subtab="scoring">Scoring &amp; Bets</button>

        ${activeSection === 'duty' ? `<div id="ts-duty-panel"></div>` : ''}
        ${activeSection === 'schedule' ? `

              <button class="ts-duty-sort-btn ${scheduleSort==='date'?'active':''}" data-schedule-sort="date">List by date</button>
              <button class="ts-duty-sort-btn ${scheduleSort==='person'?'active':''}" data-schedule-sort="person">List by person</button>
              <button class="ts-duty-sort-btn ${scheduleSort==='grid'?'active':''}" data-schedule-sort="grid">Grid view</button>
            </div>
          </div>
          ${(scheduleSort === 'calendar' || scheduleSort === 'grid') ? '' : `
          <div class="ts-duty-controls" style="margin-top:8px; padding-top:0; border-top:none;">
            <select id="ts-schedule-filter">
              <option value="">All players</option>
              ${meId ? `<option value="__me__" ${scheduleFilterId==='__me__'?'selected':''}>Just my dates</option>` : ''}
              ${sortedRoster().map(p => `<option value="${p.id}" ${scheduleFilterId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}
            </select>
          </div>`}
          ${scheduleSort === 'date' ? `
            <div class="ts-duty-controls" style="margin-top:0; padding-top:0; border-top:none;">
              <div class="ts-duty-sort">
                <button class="ts-duty-sort-btn ${expandCollapseState==='expand'?'subtle-active':''}" id="ts-expand-all">Expand All</button>
                <button class="ts-duty-sort-btn ${expandCollapseState==='collapse'?'subtle-active':''}" id="ts-collapse-all">Collapse All</button>
              </div>
              <span></span>
            </div>` : ''}
          ${scheduleSort === 'calendar' ? `
            <div class="ts-duty-controls" style="margin-top:0; padding-top:0; border-top:none;">
              <div class="ts-duty-sort">
                <button class="ts-duty-sort-btn ${expandCollapseState==='expand'?'subtle-active':''}" id="ts-expand-all">Expand All</button>
                <button class="ts-duty-sort-btn ${expandCollapseState==='collapse'?'subtle-active':''}" id="ts-collapse-all">Collapse All</button>
              </div>
              <span></span>
            </div>` : ''}
          ${scheduleSort === 'date' ? `<div id="ts-schedule"></div>`
            : scheduleSort === 'calendar' ? `<div id="ts-schedule-calendar"></div>`
            : scheduleSort === 'grid' ? `<div id="ts-schedule-grid"></div>`
            : `<div id="ts-schedule-by-person"></div>`}
        ` : ''}
        <p class="ts-footer-note">Prototype — signups and duty sync for everyone using this link.<br>Real day-before texts/emails aren't wired up yet; this shows reminders when the app is open.</p>
      </div>`;

    root.innerHTML = html;

    if(activeSection === 'duty'){
      renderDutyPanel(document.getElementById('ts-duty-panel'), schedule);
    }

    if(activeSection === 'admin'){
      const contentEl = document.getElementById('ts-admin-content');
      if(adminSubTab === 'roster') renderRosterPanel(contentEl);
      else if(adminSubTab === 'closures') renderClosuresPanel(contentEl, schedule);
      else if(adminSubTab === 'data') renderDataPanel(contentEl);
      else if(adminSubTab === 'reminders') renderRemindersPanel(contentEl);
      else if(adminSubTab === 'handicaps') renderHandicapsPanel(contentEl);
      else if(adminSubTab === 'scoring') renderScoringPanel(contentEl);
    }

    function renderDateCardHtml(d){
      const key = fmtDateKey(d);
      const signedEntries = data.signups[key] || [];
      const count = signedEntries.length;
      const tt = count > 0 ? Math.ceil(count/PLAYERS_PER_TEE_TIME) : 0;
      const confirmedCount = data.confirmedTeeTimes[key];
      const capacity = capacityFor(key);
      const { confirmed, standby } = splitConfirmedStandby(signedEntries, capacity);

      const mySignup = meId ? findSignup(key, meId) : null;
      const iAmStandby = mySignup && capacity != null && !confirmed.some(e => e.id === meId);
      const isOpen = expanded[key];

      function sortByLastName(entries){
        return [...entries].sort((a,b) => {
          const pa = data.roster.find(r=>r.id===a.id);
          const pb = data.roster.find(r=>r.id===b.id);
          const na = pa ? lastNameOf(pa.name) : '';
          const nb = pb ? lastNameOf(pb.name) : '';
          return na.localeCompare(nb);
        });
      }

      function chipsFor(entries){
        return entries.length
          ? entries.map(entry => {
              const p = data.roster.find(r=>r.id===entry.id);
              if(!p) return '';
              const badge = HOLES_SHORT[entry.holes] ? `<span class="holes-badge">${HOLES_SHORT[entry.holes]}</span>` : '';
              const guestBadge = p.isGuest ? `<span class="ts-guest-badge">Guest</span>` : '';
              const removeBtn = isAdmin ? `<button class="chip-remove" data-admin-remove="${key}|${entry.id}" title="Remove ${esc(p.name)}">×</button>` : '';
              return `<span class="name-chip ${entry.id===meId?'me':''}">${esc(p.name)}${guestBadge}${badge}${removeBtn}</span>`;
            }).join('')
          : `<span class="ts-empty">No one signed up yet</span>`;
      }

      // When there's a standby list, it's only ever because fewer tee times came
      // back than were needed — the app doesn't decide who sits out, it just sorts
      // by signup order as a placeholder (and alerts the admin, see notifyShortfall)
      // so the group can actually decide. This note keeps that from reading as final.
      const namesHtml = capacity != null
        ? `<div class="ts-chip-group-label">Playing (${confirmed.length}/${capacity})</div>${chipsFor(sortByLastName(confirmed))}
           ${standby.length ? `<div class="ts-chip-group-label standby">Standby (${standby.length})</div>${chipsFor(sortByLastName(standby))}
           <div class="ts-note" style="border-top:none; padding-top:0; margin-top:4px;">Sorted by signup order for now — who's actually sitting out for ${DOW_NAMES[d.getDay()]}, ${MON_NAMES[d.getMonth()]} ${d.getDate()} hasn't been decided yet.</div>` : ''}`
        : chipsFor(sortByLastName(signedEntries));

      const rosterIdsSignedUp = signedEntries.map(e => e.id);
      const adminAddControl = (isAdmin && !data.closures[key])
        ? `<div class="ts-admin-add">
             <select class="ts-admin-add-select" data-admin-add-key="${key}">
               <option value="">+ Add a player…</option>
               ${sortedRoster().filter(p => !rosterIdsSignedUp.includes(p.id)).map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}
             </select>
             <button class="ts-admin-add-guest-btn" data-admin-add-guest-key="${key}">+ Add a guest…</button>
           </div>`
        : '';

      // What this date is FOR in terms of booking: two weeks from today's card is the
      // play date someone would need to go to the pro shop about, in person, on this very day.
      const targetDate = new Date(d); targetDate.setDate(targetDate.getDate() + BOOKING_WINDOW_DAYS);
      const targetKey = fmtDateKey(targetDate);
      const targetDuty = dutyForKey(targetKey);

      const dutyControl = `<span class="ts-duty-static">${targetDuty ? esc(targetDuty.name) + ' has booking duty' : 'No one has booking duty yet'}</span>`;

      const generatedTeams = data.teams[key];
      const teamsHtml = generatedTeams ? `
        <div class="ts-teams-block">
          <div class="ts-chip-group-label">Teams</div>
          ${generatedTeams.teams.map((team, i) => `
            <div class="ts-team-row">
              <span class="ts-team-num">Team ${i+1}</span>
              ${team.map(p => `<span class="name-chip">${esc(p.name)}${p.courseHandicap !== null ? ` <span class="ts-team-so">(HC ${p.courseHandicap}${p.strokesOff !== null ? `, Strokes off ${p.strokesOff}` : ''})</span>` : ''}</span>`).join('')}
            </div>`).join('')}
          ${generatedTeams.notInBet && generatedTeams.notInBet.length ? `
            <div class="ts-team-row">
              <span class="ts-team-num" style="color:var(--rust);">Not in the bet</span>
              ${generatedTeams.notInBet.map(p => `<span class="name-chip">${esc(p.name)} <span class="ts-team-so">(${esc(p.reason)})</span></span>`).join('')}
            </div>` : ''}
        </div>` : '';

      const closure = data.closures[key];

      // The "Confirmed: [–]" input used to also be reachable from this card, as a
      // fallback for when a booking day slipped into the past before someone got to
      // the Booking Duty tab. Removed from here per request — entering confirmed
      // tee times now happens only on the Booking Duty tab; this card's top-line
      // badge still shows the confirmed count once it's entered there.

      const countBadge = capacity != null
        ? `${confirmed.length}/${capacity} confirmed${standby.length ? ` <span class="ts-standby-count">+${standby.length} standby</span>` : ''}`
        : `${count} signed up`;
      const teeTimesBadge = confirmedCount
        ? `${confirmedCount} confirmed`
        : `${tt} tee time${tt===1?'':'s'}`;

      const midSection = closure
        ? `<div class="ts-closed-line"><span class="closed-flag">🚫</span><span class="closed-text">Course Closed${closure.trim() ? ' — ' + esc(closure) : ''}</span></div>`
        : `<div class="ts-card-mid-top">
             <span class="ts-count">${countBadge}</span>
             <span class="ts-teetimes ${(!confirmedCount && tt===0)?'zero':''}">${teeTimesBadge}</span>
           </div>
           <div class="ts-duty">
             <span class="golf-flag">⛳</span>
             ${dutyControl}
           </div>`;

      // "in" option label reflects current or would-be status; "out" option makes
      // removal an explicit, visible choice instead of an implicit second click on
      // the same button (players were reporting they couldn't find how to remove
      // themselves from a date).
      const inOptionLabel = mySignup
        ? (iAmStandby ? "On standby ✓" : "I'm in ✓")
        : (capacity != null && confirmed.length >= capacity ? "Join standby list" : "I'm in");
      const outOptionLabel = mySignup ? "Remove me" : "Not playing";

      // Show whatever tee this signup is actually saved as; if none was ever set for
      // this specific date (e.g. it predates the player having a default tee, or predates
      // this dropdown), fall back to the player's default tee from Admin > Handicaps just
      // for display, so the dropdown doesn't look like it's arbitrarily showing the first
      // tee in the list. Doesn't touch saved data — team generation already falls back the
      // same way (entry.tee || p.defaultTee), so this is purely a display fix.
      const effectiveTee = mySignup ? (mySignup.tee || (me && me.defaultTee) || '') : '';

      const toggleSection = closure
        ? `<span class="ts-closed-toggle-label">Closed</span>`
        : `<div class="ts-toggle-wrap">
             <select class="ts-signup-select ${mySignup?'in':''} ${iAmStandby?'standby':''}" data-signup-select="${key}" ${meId ? '' : 'disabled title="Select your name first"'}>
               <option value="out" ${!mySignup?'selected':''}>${outOptionLabel}</option>
               <option value="in" ${mySignup?'selected':''}>${inOptionLabel}</option>
             </select>
             ${mySignup ? `
               <div class="ts-holes-group">
                 ${HOLES_CYCLE.map(h => `<button class="ts-holes-pill ${mySignup.holes===h?'active':''}" data-holes-set="${key}|${h}">${HOLES_PILL_LABEL[h]}</button>`).join('')}
               </div>` : ''}
             ${mySignup && data.teeOptions.length ? `
               <select class="ts-tee-select" data-tee-set="${key}">
                 ${data.teeOptions.map(tee => `<option value="${esc(tee)}" ${effectiveTee===tee?'selected':''}>${esc(tee)} tee</option>`).join('')}
               </select>` : ''}
           </div>`;

      return `
        <div class="ts-card ${closure?'closed':''}" data-key="${key}">
          <div class="ts-card-row" data-expand="${key}">
            <div class="ts-date-block">
              <div class="ts-date-dow">${DOW_NAMES[d.getDay()]}</div>

            <div class="ts-card-mid">
              ${midSection}
            </div>
            ${toggleSection}
          </div>
          <div class="ts-players ${isOpen?'open':''}">
            ${namesHtml}
            ${teamsHtml}
            ${isOpen ? adminAddControl : ''}
          </div>
        </div>`;
    }

    if(activeSection === 'schedule' && scheduleSort === 'date'){
    const schedEl = document.getElementById('ts-schedule');
    const effectiveScheduleFilterId = scheduleFilterId === '__me__' ? meId : scheduleFilterId;
    const filteredSchedule = effectiveScheduleFilterId
      ? schedule.filter(d => (data.signups[fmtDateKey(d)] || []).some(e => e.id === effectiveScheduleFilterId))
      : schedule;
    schedEl.innerHTML = (filteredSchedule.length ? filteredSchedule.map((d) => renderDateCardHtml(d)).join('') : `<p class="ts-empty">No dates match this filter.</p>`);
    }

    if(activeSection === 'schedule' && scheduleSort === 'calendar'){
      const calEl = document.getElementById('ts-schedule-calendar');
      const headerHtml = `
        <div class="ts-cal-header">Monday</div>
        <div class="ts-cal-header">Wednesday</div>
        <div class="ts-cal-header">Friday</div>`;
      // Schedule starts from today forward, so if today falls after Monday, the first
      // entry can be a Wednesday or Friday — pad the front with blanks so every card
      // still lines up under its correct weekday column instead of shifting left.
      const firstDow = schedule.length ? schedule[0].getDay() : 1;
      const padCount = firstDow === 3 ? 1 : firstDow === 5 ? 2 : 0;
      const padHtml = `<div class="ts-cal-cell ts-cal-blank"></div>`.repeat(padCount);
      const cardsHtml = schedule.map(d => `<div class="ts-cal-cell">${renderDateCardHtml(d)}</div>`).join('');
      calEl.innerHTML = `<div class="ts-cal-grid">${headerHtml}${padHtml}${cardsHtml}</div>`;
    }

    if(activeSection === 'schedule' && scheduleSort === 'grid'){
      const gridEl = document.getElementById('ts-schedule-grid');
      const roster = sortedRoster();
      const headerCells = roster.map(p => `<th>${esc(lastNameOf(p.name))}</th>`).join('');
      const bodyRows = schedule.map(d => {
        const key = fmtDateKey(d);
        const dateLabel = `${DOW_NAMES[d.getDay()]} ${MON_NAMES[d.getMonth()]} ${d.getDate()}`;
        if(data.closures[key]){
          return `<tr><td class="ts-grid-date">${dateLabel}</td><td class="ts-grid-closed" colspan="${roster.length}">Club Closed</td></tr>`;
        }
        const signedIds = new Set((data.signups[key] || []).map(e => e.id));
        const cells = roster.map(p => `<td>${signedIds.has(p.id) ? esc(p.name) : ''}</td>`).join('');
        return `<tr><td class="ts-grid-date">${dateLabel}</td>${cells}</tr>`;
      }).join('');
      gridEl.innerHTML = `
        <p class="ts-grid-disclaimer">For informational purposes only. Changes to the calendar cannot be made here.</p>
        <div class="ts-grid-wrap">
          <table class="ts-grid-table">
            <thead><tr><th>Date</th>${headerCells}</tr></thead>
            <tbody>${bodyRows}</tbody>
          </table>
        </div>`;
    }

    if(activeSection === 'schedule' && scheduleSort === 'person'){
      const byPersonEl = document.getElementById('ts-schedule-by-person');
      const effectiveScheduleFilterId = scheduleFilterId === '__me__' ? meId : scheduleFilterId;
      const roster = effectiveScheduleFilterId
        ? sortedRoster().filter(p => p.id === effectiveScheduleFilterId)
        : sortedRoster();

      const groupsHtml = roster.map(p => {
        const dates = schedule.filter(d => (data.signups[fmtDateKey(d)] || []).some(e => e.id === p.id));
        const rowsHtml = dates.length ? dates.map(d => {
          const key = fmtDateKey(d);
          const entry = data.signups[key].find(e => e.id === p.id);
          const holesSuffix = entry.holes !== '18' ? ` — ${HOLES_LABEL[entry.holes]}` : '';
          return `
            <div class="ts-duty-row">
              <div class="ts-date-block">
                <div class="ts-date-dow">${DOW_NAMES[d.getDay()]}</div>
                <div class="ts-date-num">${d.getDate()}</div>
                <div class="ts-date-mon">${MON_NAMES[d.getMonth()]}</div>
              </div>
              <div class="ts-duty-row-mid">
                <span class="ts-duty-static">Playing${holesSuffix}</span>
              </div>
            </div>`;
        }).join('') : `<p class="ts-empty">No upcoming dates</p>`;
        return `
          <div class="ts-person-group">
            <h5>${esc(p.name)}</h5>
            ${rowsHtml}
          </div>`;
      }).join('');

      byPersonEl.innerHTML = `<div class="ts-roster-panel">${groupsHtml}</div>`;
    }

    wireEvents();
    if(activeSection === 'admin') wireRosterPanel();
  }

  function renderHandicapsPanel(el){
    if(!isAdmin){
      el.innerHTML = `
        <div class="ts-roster-panel">
          <div class="ts-locked-panel">
            Handicaps are admin-only.
            <br><button id="ts-unlock-handicaps">Enter admin PIN</button>
          </div>
        </div>`;
      return;
    }
    const teeRows = data.teeOptions.map(tee => {
      const r = data.teeRatings[tee] || {};
      return `<div class="ts-closure-row"><span class="ts-closure-date">${esc(tee)}</span><span class="ts-closure-status">Rating ${r.rating ?? '?'} / Slope ${r.slope ?? '?'}</span></div>`;
    }).join('') || '<p class="ts-empty">No tee ratings loaded yet.</p>';

    const hhComplete = holeHandicapsComplete();
    const hhFilledCount = Array.from({ length: 18 }, (_, i) => i + 1).filter(h => typeof data.holeHandicaps[String(h)] === 'number').length;
    let hhStatusHtml = '';
    if(hhComplete){
      hhStatusHtml = `<p style="margin:6px 0 0; color:var(--fairway); font-weight:600;">✓ All 18 set — the Scoring &amp; Bets tab is using exact hole-by-hole strokes.</p>`;
    } else if(hhFilledCount === 0){
      hhStatusHtml = `<p style="margin:6px 0 0;">Not set yet — Scoring &amp; Bets is falling back to an even split of strokes across the 3 series instead.</p>`;
    } else {
      hhStatusHtml = `<div class="ts-warn-banner" style="border-radius:8px; margin-top:6px;"><b>${hhFilledCount} of 18 entered</b>, and/or the ranks entered aren't exactly 1–18 with no repeats — Scoring &amp; Bets will keep falling back to the even split until this is complete and valid.</div>`;
    }
    const hhRowHtml = (start) => `
      <div class="ts-hh-row">
        ${Array.from({ length: 9 }, (_, i) => start + i).map(h => `
          <div class="ts-hh-cell">
            <label>Hole ${h}</label>
            <input type="number" min="1" max="18" step="1" data-hole-handicap="${h}" value="${typeof data.holeHandicaps[String(h)] === 'number' ? data.holeHandicaps[String(h)] : ''}">
          </div>`).join('')}
      </div>`;

    const STALE_DAYS = 15;
    let staleBannerHtml = '';
    if(!data.handicapUpdatedAt){
      staleBannerHtml = `<div class="ts-warn-banner" style="border-radius:8px; margin-bottom:12px;"><b>No handicap update on record yet</b> — import a fresh snapshot to get started.</div>`;
    } else {
      const daysSince = Math.floor((Date.now() - data.handicapUpdatedAt) / (1000*60*60*24));
      if(daysSince > STALE_DAYS){
        staleBannerHtml = `<div class="ts-warn-banner" style="border-radius:8px; margin-bottom:12px;"><b>Handicaps haven't been updated in ${daysSince} days</b> — since these update about twice a month, it may be time for a fresh import.</div>`;
      }
    }

    // Course handicap for whoever has the lowest number plays to scratch (0 strokes) —
    // everyone else's "Strokes Off" is their own course handicap minus that lowest one.
    const withCourseHcp = data.roster
      .filter(p => p.defaultTee && p.courseHandicaps && typeof p.courseHandicaps[p.defaultTee] === 'number')
      .map(p => ({ id: p.id, ch: p.courseHandicaps[p.defaultTee] }));
    const lowestCH = withCourseHcp.length ? Math.min(...withCourseHcp.map(x => x.ch)) : null;

    const playerRows = sortedRoster().map(p => {
      const hcp = typeof p.handicapIndex === 'number' ? p.handicapIndex.toFixed(1) : '—';
      const courseHcp = (p.defaultTee && p.courseHandicaps && typeof p.courseHandicaps[p.defaultTee] === 'number')
        ? p.courseHandicaps[p.defaultTee]
        : null;
      const strokesOff = (courseHcp !== null && lowestCH !== null) ? (courseHcp - lowestCH) : null;
      return `
        <div class="ts-roster-row" data-hpid="${p.id}">
          <span style="flex:1;">${esc(p.name)}</span>
          <span style="width:70px; font-family:'IBM Plex Mono',monospace; font-size:12px;">HI: ${hcp}</span>
          <select data-default-tee="${p.id}" style="flex:1; font-family:'Inter'; font-size:13px; padding:6px 8px; border-radius:6px; border:1px solid var(--ivory-line);">
            <option value="">No default tee</option>
            ${data.teeOptions.map(tee => `<option value="${esc(tee)}" ${p.defaultTee===tee?'selected':''}>${esc(tee)}</option>`).join('')}
          </select>
          <span style="width:90px; font-family:'IBM Plex Mono',monospace; font-size:12px; text-align:right;">${courseHcp !== null ? 'Strokes: ' + courseHcp : ''}</span>
          <span style="width:100px; font-family:'IBM Plex Mono',monospace; font-size:12px; text-align:right;">${strokesOff !== null ? 'S.O.: ' + strokesOff : ''}</span>
        </div>`;
    }).join('');

    el.innerHTML = `
      <div class="ts-roster-panel">
        ${staleBannerHtml}
        <div class="ts-import-row" style="margin-top:0; padding-top:0; border-top:none;">
          <span class="ts-import-row-label">Tee ratings</span>
          <p style="margin:0 0 10px;">Course rating and slope for each tee — these rarely change. Loaded from the last handicap update.</p>
          ${teeRows}
        </div>
        <div class="ts-import-row">
          <span class="ts-import-row-label">Hole handicaps (stroke index)</span>
          <p style="margin:0 0 10px;">Each hole's difficulty rank, 1 (hardest) to 18 (easiest), off your scorecard — this rarely changes and is normally the same regardless of tee. It's what lets Scoring &amp; Bets give a player with, say, 5 strokes off a stroke on exactly the 5 hardest holes instead of splitting strokes evenly.</p>
          ${hhRowHtml(1)}
          ${hhRowHtml(10)}
          ${hhStatusHtml}
        </div>
        <div class="ts-import-row">
          <span class="ts-import-row-label">Player handicaps</span>
          <p style="margin:0 0 10px;">Handicap Index (HI) updates about twice a month — paste a fresh update via Import data snapshot on the Data tab. Set each player's default tee here. "Strokes" is their course handicap at that tee; "S.O." is how many strokes they get relative to whoever in the whole roster has the lowest course handicap (who plays to scratch).</p>
          ${playerRows || '<p class="ts-empty">No players yet.</p>'}
        </div>
        <div class="ts-import-row">
          <button id="ts-generate-teams-btn">Generate teams now</button>
          <p>Balances teams by handicap for the next play day, using each player's tee for that round. This will eventually run automatically the night before — for now, use this to test it.</p>
        </div>
      </div>
    `;
  }

  // Scoring & Bets: hole-by-hole score entry for a date's generated teams,
  // and the resulting series-by-series bet standings. Admin-only for now
  // (kept under Admin until this is ready to hand to players directly), but
  // any admin — including the scorekeeper for a given group, once they're
  // set up as an admin on the roster — can enter scores for any team here.
  function renderScoringPanel(el){
    if(!isAdmin){
      el.innerHTML = `
        <div class="ts-roster-panel">
          <div class="ts-locked-panel">
            Scoring &amp; bets are admin-only for now.
            <br><button id="ts-unlock-scoring">Enter admin PIN</button>
          </div>
        </div>`;
      return;
    }

    const teamDates = Object.keys(data.teams).sort();
    if(teamDates.length === 0){
      el.innerHTML = `
        <div class="ts-roster-panel">
          <p class="ts-empty">No teams have been generated for any date yet — generate teams on the Handicaps tab first, then come back here to score that round.</p>
        </div>`;
      return;
    }
    if(!scoringSelectedDate || !teamDates.includes(scoringSelectedDate)){
      scoringSelectedDate = teamDates[teamDates.length - 1];
    }
    const dateKey = scoringSelectedDate;
    const teamsInfo = data.teams[dateKey];
    const round = ensureRoundDefaults(dateKey);
    const groups = seriesHoleGroups(round.startHole);
    const flatHoles = groups.flat();
    const standings = computeSeriesStandings(dateKey);
    const exact = holeHandicapsComplete();

    const d = new Date(dateKey + 'T00:00:00');
    const dateLabel = `${DOW_NAMES[d.getDay()]}, ${MON_NAMES[d.getMonth()]} ${d.getDate()}`;
    const dateOptionsHtml = teamDates.slice().reverse().map(k => {
      const kd = new Date(k + 'T00:00:00');
      return `<option value="${k}" ${k===dateKey?'selected':''}>${DOW_NAMES[kd.getDay()]}, ${MON_NAMES[kd.getMonth()]} ${kd.getDate()}</option>`;
    }).join('');

    const teamCardsHtml = teamsInfo.teams.map((team, ti) => {
      const rowsHtml = team.map(p => {
        const playerScores = round.scores[p.id] || {};
        const cellsHtml = flatHoles.map(h => {
          const v = playerScores[String(h)];
          const strokesHere = exact ? strokesReceivedOnHole(p.strokesOff, h) : 0;
          const strokeTitle = strokesHere > 0 ? ` title="${p.name.split(' ')[0]} gets ${strokesHere} stroke${strokesHere===1?'':'s'} here"` : '';
          return `<td class="${strokesHere > 0 ? 'ts-score-stroke' : ''}"${strokeTitle}><input type="number" inputmode="numeric" min="1" max="15" step="1" class="ts-score-input"
                    data-score-date="${dateKey}" data-score-player="${p.id}" data-score-hole="${h}"
                    value="${typeof v === 'number' ? v : ''}"></td>`;
        }).join('');
        return `<tr><td class="ts-score-name">${esc(p.name)}${p.strokesOff ? ` <span class="ts-team-so">(S.O. ${p.strokesOff})</span>` : ''}</td>${cellsHtml}</tr>`;
      }).join('');

      return `
        <div class="ts-teams-block" style="margin-top:16px;">
          <div class="ts-team-num">Team ${ti+1}</div>
          <div style="overflow-x:auto;">
            <table class="ts-score-table">
              <thead>
                <tr><th></th><th colspan="${HOLES_PER_SERIES}">Series 1</th><th colspan="${HOLES_PER_SERIES}">Series 2</th><th colspan="${HOLES_PER_SERIES}">Series 3</th></tr>
                <tr><th></th>${flatHoles.map(h => `<th>${h}</th>`).join('')}</tr>
              </thead>
              <tbody>${rowsHtml}</tbody>
            </table>
          </div>
        </div>`;
    }).join('');

    const standingsHtml = standings ? `
      <div class="ts-import-row">
        <span class="ts-import-row-label">Series results</span>
        ${groups.map((holes, si) => {
          const rowsHtml = standings.matchups.filter(m => m.seriesIndex === si).map(m => {
            let resultText;
            if(!m.result) resultText = `<span class="ts-empty">in progress</span>`;
            else if(m.result === 'push') resultText = `Push (${m.aNet}–${m.bNet})`;
            else if(m.result === 'A') resultText = `Team ${m.teamA+1} wins ${fmtMoney(standings.stake)} (${m.aNet}–${m.bNet})`;
            else resultText = `Team ${m.teamB+1} wins ${fmtMoney(standings.stake)} (${m.bNet}–${m.aNet})`;
            return `<div class="ts-bet-row"><span class="ts-bet-label">Team ${m.teamA+1} vs Team ${m.teamB+1}</span><span class="ts-bet-result">${resultText}</span></div>`;
          }).join('');
          return `<div style="margin-top:10px;"><b style="font-size:12.5px;">Series ${si+1}</b> <span class="ts-team-so">(holes ${holes.join(', ')})</span>${rowsHtml}</div>`;
        }).join('')}
        <div class="ts-teams-block">
          <div class="ts-team-num">Running total</div>
          ${standings.teamTotals.map((t, i) => `<div class="ts-bet-row"><span class="ts-bet-label">Team ${i+1}</span><span class="ts-bet-result" style="color:${t>0?'var(--fairway)':t<0?'var(--rust)':'inherit'};">${fmtMoney(t)}</span></div>`).join('')}
        </div>
      </div>` : '';

    el.innerHTML = `
      <div class="ts-roster-panel">
        <div class="ts-import-row" style="margin-top:0; padding-top:0; border-top:none;">
          <span class="ts-import-row-label">Round</span>
          <div style="margin-top:6px;">
            <select id="ts-scoring-date-select" style="font-family:'Inter'; font-size:13px; padding:6px 10px; border-radius:7px; border:1px solid var(--ivory-line);">
              ${dateOptionsHtml}
            </select>
          </div>
        </div>
        <div class="ts-import-row">
          <span class="ts-import-row-label">Round setup — ${esc(dateLabel)}</span>
          <div style="display:flex; gap:18px; flex-wrap:wrap; align-items:center; margin-top:6px;">
            <label style="font-size:12px; color:#6b6a5e; font-weight:500;">Starting hole
              <select id="ts-round-start-hole" style="margin-left:6px; font-family:'Inter'; font-size:13px; padding:6px 10px; border-radius:7px; border:1px solid var(--ivory-line);">
                <option value="1" ${round.startHole===1?'selected':''}>1 (front)</option>
                <option value="10" ${round.startHole===10?'selected':''}>10 (back)</option>
              </select>
            </label>
            <label style="font-size:12px; color:#6b6a5e; font-weight:500;">Stake per series
              <span style="margin-left:6px;">$</span><input id="ts-round-stake" type="number" min="0" step="1" value="${round.stakePerSeries}"
                style="width:50px; font-family:'Inter'; font-size:13px; padding:6px 8px; border-radius:7px; border:1px solid var(--ivory-line);">
            </label>
          </div>
          <p style="margin:8px 0 0;">${exact
            ? 'Strokes are applied hole-by-hole using the hole handicaps set on the Handicaps tab — shaded cells below are where that player gets a stroke.'
            : '<span style="color:var(--rust); font-weight:600;">Hole handicaps (stroke index) aren\'t fully set on the Handicaps tab yet</span> — strokes off are being split as evenly as possible across the 3 series instead, as an approximation. Set all 18 hole handicaps for exact stroke-by-stroke allocation.'
          } Enter each player's gross score per hole below; net and bet results update as scores come in.</p>
        </div>
        ${teamCardsHtml}
        ${standingsHtml}
      </div>
    `;
  }

  function renderClosuresPanel(el, schedule){
    if(!isAdmin){
      el.innerHTML = `
        <div class="ts-roster-panel">
          <div class="ts-locked-panel">
            Course closures are admin-only.
            <br><button id="ts-unlock-closures">Enter admin PIN</button>
          </div>
        </div>`;

  // Booking Duty panel: one row per Mon/Wed/Fri date, letting the admin pick who's
  // heading to the club THAT day to request tee times for the round two weeks later.
  // --- Duty swaps: a lightweight request-and-agree flow. One player proposes trading
  // their booking-duty date for someone else's; nothing changes until that other player
  // accepts. Either side can back out first (cancel or decline).
  function myPendingOutgoing(){
    return Object.values(data.swapRequests).find(s => s.status === 'pending' && s.requesterId === meId);
  }
  function pendingIncomingFor(personId){
    return Object.values(data.swapRequests).filter(s => s.status === 'pending' && s.targetId === personId);
  }
  function pendingOutgoingFrom(key){
    return Object.values(data.swapRequests).find(s => s.status === 'pending' && s.fromKey === key);
  }

  async function requestSwap(fromKey, schedule){
    if(!meId) return;
    if(data.closures[fromKey]){
      await showMessage("This date is closed", "The course is closed for this date, so there's no need to request tee times — nothing to swap.");
      return;
    }
    if(myPendingOutgoing()){
      await showMessage("You've already got a request out", 'Cancel your pending swap request before starting a new one.');
      return;
    }
    const options = [];
    schedule.forEach(d => {
      const target = new Date(d); target.setDate(target.getDate() + BOOKING_WINDOW_DAYS);
      const targetKey = fmtDateKey(target);
      if(targetKey === fromKey) return;
      if(data.closures[targetKey]) return;
      const assigned = dutyForKey(targetKey);
      if(!assigned || assigned.id === meId) return;
      const label = `${DOW_NAMES[target.getDay()]}, ${MON_NAMES[target.getMonth()]} ${target.getDate()} — ${assigned.name}`;
      options.push({ value: targetKey, label });
    });
    if(options.length === 0){
      await showMessage('No dates to swap with', "There's no one else with an upcoming booking-duty date right now.");
      return;
    }
    const toKey = await askChoice('Request a duty swap', 'Trade your date for whose?', options, 'Send request');
    if(!toKey) return;
    const targetPerson = dutyForKey(toKey);
    if(!targetPerson) return;
    const id = 'swap_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
    data.swapRequests[id] = { id, fromKey, toKey, requesterId: meId, targetId: targetPerson.id, status: 'pending' };
    logActivity('swap_requested', { fromKey, toKey, otherName: targetPerson.name });
    await saveData();
    await showMessage('Request sent', `Asked ${targetPerson.name} to swap. You'll see it here once they respond.`);
  }

  async function cancelSwap(id){
    delete data.swapRequests[id];
    await saveData();
  }

  async function respondToSwap(id, accept){
    const req = data.swapRequests[id];
    if(!req) return;
    const stillValid = data.duty[req.fromKey] === req.requesterId && data.duty[req.toKey] === req.targetId;
    if(!stillValid){
      delete data.swapRequests[id];
      await saveData();
      await showMessage('No longer valid', "One of these dates has changed since the request was made, so this swap can't go through.");
      return;
    }
    if(accept){
      data.duty[req.fromKey] = req.targetId;
      data.duty[req.toKey] = req.requesterId;
    }
    const requester = data.roster.find(p => p.id === req.requesterId);
    logActivity(accept ? 'swap_accepted' : 'swap_declined', { fromKey: req.fromKey, toKey: req.toKey, otherName: requester ? requester.name : 'someone' });
    delete data.swapRequests[id];
    await saveData();
    await showMessage(accept ? 'Swap complete' : 'Declined', accept ? 'The two dates have been swapped.' : "You've declined the swap.");
  }

  function renderDutyPanel(el, schedule){
    const today = new Date(); today.setHours(0,0,0,0);
    let rows = schedule.map(d => {
      const target = new Date(d); target.setDate(target.getDate() + BOOKING_WINDOW_DAYS);
      const targetKey = fmtDateKey(target);
      const assigned = dutyForKey(targetKey);
      const targetCount = (data.signups[targetKey] || []).length;
      const targetTT = targetCount > 0 ? Math.ceil(targetCount/PLAYERS_PER_TEE_TIME) : 0;
      const closed = !!data.closures[targetKey];
      return { bookDate: d, bookKey: fmtDateKey(d), playDate: target, playKey: targetKey, assigned, tt: targetTT, closed };
    });

    const effectiveFilterId = dutyFilterId === '__me__' ? meId : dutyFilterId;
    if(dutySort !== 'calendar'){
      if(dutyFilterId === '__unassigned__'){
        rows = rows.filter(r => !r.assigned);
      } else if(effectiveFilterId){
        rows = rows.filter(r => r.assigned && r.assigned.id === effectiveFilterId);
      }
    }

    if(dutySort === 'person'){
      rows = [...rows].sort((a,b) => {
        const na = a.assigned ? lastNameOf(a.assigned.name) : 'zzzzzz';
        const nb = b.assigned ? lastNameOf(b.assigned.name) : 'zzzzzz';
        const cmp = na.localeCompare(nb);
        return cmp !== 0 ? cmp : a.bookDate - b.bookDate;
      });
    }

    const rowsHtml = dutySort === 'calendar' ? '' : (rows.length ? rows.map(r => {
      const playLabel = `${DOW_NAMES[r.playDate.getDay()]}, ${MON_NAMES[r.playDate.getMonth()]} ${r.playDate.getDate()}`;
      const assignedControl = isAdmin
        ? `<select data-panel-duty-key="${r.playKey}">
             <option value="">Unassigned</option>
             ${sortedRoster().map(p => `<option value="${p.id}" ${r.assigned && r.assigned.id===p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}
           </select>`
        : `<span class="ts-duty-static">${r.assigned ? esc(r.assigned.name) : 'Unassigned'}</span>`;

      let swapControl = '';
      if(!r.closed && meId && r.assigned && r.assigned.id === meId){
        const outgoing = pendingOutgoingFrom(r.playKey);
        swapControl = outgoing
          ? `<span class="ts-swap-pending">Swap requested <button data-cancel-swap="${outgoing.id}">Cancel</button></span>`
          : `<button class="ts-swap-btn" data-request-swap="${r.playKey}">🔁 Request swap</button>`;
      }

      const todayKey = fmtDateKey(new Date());
      const dayRef = r.bookKey === todayKey
        ? 'today'
        : `on ${DOW_NAMES[r.bookDate.getDay()]}, ${MON_NAMES[r.bookDate.getMonth()]} ${r.bookDate.getDate()}`;
      const arrival = arrivalTimeFor(r.bookKey);
      const arrivalPhrase = arrival ? `at ${arrival}` : '(time varies by season)';

      const subText = r.closed
        ? `<span style="color:var(--rust); font-weight:600;">🚫 Course closed two weeks from today — no need to get tee times</span>`
        : `Head to the pro shop ${dayRef} ${arrivalPhrase} and request ${r.tt} tee time${r.tt===1?'':'s'} for ${playLabel}.`;

      // Same rule as the date card: can't confirm real tee times before the actual
      // booking day (r.bookDate) has arrived — you can only go to the pro shop in
      // the present, not the future. Admins can still fix/clear a value any time.
      const bookingDayArrived = daysBetween(today, r.bookDate) <= 0;
      const canConfirm = !r.closed && (isAdmin || (meId && bookingDayArrived && r.assigned && r.assigned.id === meId));
      const confirmed = data.confirmedTeeTimes[r.playKey];
      let confirmControl = '';
      if(canConfirm){
        confirmControl = `<div class="ts-duty-row-sub ts-confirm-row">
            <label>Confirmed:</label>
            <select data-confirm-key="${r.playKey}" style="width:52px; font-family:'Inter'; font-size:13px; padding:5px 4px; border-radius:6px; border:1px solid var(--ivory-line);">
              <option value="" ${!confirmed?'selected':''}>–</option>
              ${[1,2,3].map(n => `<option value="${n}" ${confirmed===n?'selected':''}>${n}</option>`).join('')}
            </select>
            <span>tee time${confirmed===1?'':'s'} booked ${dayRef} for ${playLabel}</span>
          </div>`;
      } else if(typeof confirmed === 'number' && confirmed > 0){
        confirmControl = `<div class="ts-duty-row-sub">✅ ${confirmed} tee time${confirmed===1?'':'s'} booked ${dayRef} for ${playLabel}</div>`;
      }

      return `
        <div class="ts-duty-row">
          <div class="ts-date-block">
            <div class="ts-date-dow">${DOW_NAMES[r.bookDate.getDay()]}</div>
            <div class="ts-date-num">${r.bookDate.getDate()}</div>
            <div class="ts-date-mon">${MON_NAMES[r.bookDate.getMonth()]}</div>
          </div>
          <div class="ts-duty-row-mid">
            ${assignedControl}
            <div class="ts-duty-row-sub">${subText}</div>
            ${confirmControl}
            ${swapControl ? `<div class="ts-duty-row-sub">${swapControl}</div>` : ''}
          </div>
        </div>`;
    }).join('') : `<p class="ts-empty">No dates match this filter.</p>`);

    let calendarHtml = '';
    if(dutySort === 'calendar'){
      const headerHtml = `
        <div class="ts-cal-header">Monday</div>
        <div class="ts-cal-header">Wednesday</div>
        <div class="ts-cal-header">Friday</div>`;
      const firstDow = rows.length ? rows[0].bookDate.getDay() : 1;
      const padCount = firstDow === 3 ? 1 : firstDow === 5 ? 2 : 0;
      const padHtml = `<div class="ts-cal-cell ts-cal-blank"></div>`.repeat(padCount);
      const cellsHtml = rows.map(r => {
        const dateLabel = `${String(r.bookDate.getMonth()+1).padStart(2,'0')}/${String(r.bookDate.getDate()).padStart(2,'0')}/${String(r.bookDate.getFullYear()).slice(2)}`;

      }).join('');
      calendarHtml = `<div class="ts-cal-grid">${headerHtml}${padHtml}${cellsHtml}</div>
        <p class="ts-note" style="border-top:none; padding-top:0;">Strikethrough = course closed that round; no tee times required.</p>`;
    }

    const incoming = meId ? pendingIncomingFor(meId) : [];
    const incomingHtml = incoming.map(req => {
      const requester = data.roster.find(p => p.id === req.requesterId);
      const fromDate = new Date(req.fromKey + 'T00:00:00');
      const toDate = new Date(req.toKey + 'T00:00:00');
      const fromLabel = `${MON_NAMES[fromDate.getMonth()]} ${fromDate.getDate()}`;
      const toLabel = `${MON_NAMES[toDate.getMonth()]} ${toDate.getDate()}`;
      return `<div class="ts-booking-alert"><span class="flag">🔁</span><div>
                <b>${esc(requester ? requester.name : 'Someone')}</b> wants to trade their <b>${fromLabel}</b> duty for your <b>${toLabel}</b> duty.
                <div style="margin-top:6px;">
                  <button class="ts-modal-ok" style="padding:5px 12px; font-size:12px;" data-accept-swap="${req.id}">Accept</button>
                  <button class="ts-modal-cancel" style="padding:5px 12px; font-size:12px;" data-decline-swap="${req.id}">Decline</button>
                </div>
              </div></div>`;
    }).join('');

    el.innerHTML = `
      <div class="ts-roster-panel">
        <div class="ts-section-title-row" style="margin:0 0 8px;">
          <h4 style="margin:0;">Booking duty — who's heading to the club</h4>
          <button class="ts-print-btn" id="ts-print-duty">🖨️ Print</button>
        </div>
        <p class="ts-note" style="border-top:none; padding-top:0; margin-top:0;">
          ${isAdmin ? 'Pick who\'s going to the pro shop on each date below.' : 'Who\'s going to the pro shop on each date, and how many tee times to request.'}
          They'll be requesting tee times for the round two weeks after that date.
        </p>
        ${incomingHtml}
        <div class="ts-duty-controls">
          <div class="ts-duty-sort">
            <button class="ts-duty-sort-btn ${dutySort==='date'?'active':''}" data-duty-sort="date">List by date</button>
            <button class="ts-duty-sort-btn ${dutySort==='person'?'active':''}" data-duty-sort="person">List by person</button>
            <button class="ts-duty-sort-btn ${dutySort==='calendar'?'active':''}" data-duty-sort="calendar">Calendar view</button>
          </div>
        </div>
        ${dutySort === 'calendar' ? '' : `
        <div class="ts-duty-controls" style="margin-top:8px;">
          <select id="ts-duty-filter">
            <option value="">All players</option>
            ${meId ? `<option value="__me__" ${dutyFilterId==='__me__'?'selected':''}>Just my dates</option>` : ''}
            <option value="__unassigned__" ${dutyFilterId==='__unassigned__'?'selected':''}>Unassigned</option>
            ${sortedRoster().map(p => `<option value="${p.id}" ${dutyFilterId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}
          </select>
        </div>`}
        <div class="ts-duty-panel">
          ${dutySort === 'calendar' ? calendarHtml : rowsHtml}
        </div>
      </div>`;
  }

        if(!isAdmin) return;
        const h = inp.getAttribute('data-hole-handicap');
        const raw = inp.value.trim();
        const val = raw === '' ? null : parseInt(raw, 10);
        if(val === null){ delete data.holeHandicaps[h]; }
        else if(isNaN(val) || val < 1 || val > 18){ await showMessage('Not valid', 'Hole handicap has to be a whole number from 1 to 18.'); render(); return; }
        else { data.holeHandicaps[h] = val; }
        await saveData();
        render();
      });
    });

    document.querySelectorAll('[data-admin-toggle]').forEach(chk => {
      chk.addEventListener('change', async () => {
        if(!isAdmin) return;
        const pid = chk.getAttribute('data-admin-toggle');
        const player = data.roster.find(p => p.id === pid);
        if(!player) return;
        if(chk.checked){ player.isAdmin = true; } else { delete player.isAdmin; }
        await saveData();
        render();
      });
    });

    document.querySelectorAll('[data-change-pin]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if(!isAdmin) return;
        const pid = btn.getAttribute('data-change-pin');
        const player = data.roster.find(p => p.id === pid);
        if(!player) return;
        const newPin = await askText(`${data.playerPins[pid] ? 'Change' : 'Set'} PIN for ${player.name}`, 'Enter a 4-digit PIN for this player.');
        if(newPin === null) return;
        const trimmed = newPin.trim();
        if(!/^\d{4}$/.test(trimmed)){ await showMessage('Needs to be 4 digits', 'Enter exactly 4 numbers, like 1234.'); return; }
        data.playerPins[pid] = trimmed;
        await saveData();
        render();
      });
    });

    const who = document.getElementById('ts-who-select');
    if(who){
      who.onchange = async () => {
        const chosen = who.value || null;
        const ok = await verifyPlayerSelection(chosen);
        if(!ok){ render(); return; }
        await persistMe(chosen);
        render();
      };
    }

    const setPinBtn = document.getElementById('ts-set-pin');
    if(setPinBtn){
      setPinBtn.onclick = async () => {
        if(!meId) return;
        const newPin = await askText('Change your PIN', "Enter a new 4-digit PIN. You'll need it next time you pick your name on a new device.");
        if(newPin === null) return;
        const trimmed = newPin.trim();
        if(!/^\d{4}$/.test(trimmed)){ await showMessage('Needs to be 4 digits', 'Enter exactly 4 numbers, like 1234.'); return; }
        data.playerPins[meId] = trimmed;
        if(!verifiedPlayers.includes(meId)){ verifiedPlayers.push(meId); await persistVerified(); }
        await saveData();
        render();
      };
    }

    const myDefaultTeeSel = document.getElementById('ts-my-default-tee');
    if(myDefaultTeeSel){
      myDefaultTeeSel.onchange = async () => {
        if(!meId) return;
        const player = data.roster.find(p => p.id === meId);
        if(!player) return;
        if(myDefaultTeeSel.value){ player.defaultTee = myDefaultTeeSel.value; } else { delete player.defaultTee; }
        await saveData();
        render();
      };
    }

    const adminPill = document.getElementById('ts-admin-pill');
    if(adminPill){
      adminPill.onclick = async () => {
        if(isAdmin){ await persistAdmin(false); render(); return; }
        const ok = await requireAdmin();
        render();
      };
    }

    document.querySelectorAll('[data-tab]').forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.getAttribute('data-tab');
        activeSection = tab;
        render();
      });
    });

    document.querySelectorAll('[data-subtab]').forEach(btn => {
      btn.addEventListener('click', () => {
        adminSubTab = btn.getAttribute('data-subtab');
        render();
      });
    });

    document.querySelectorAll('[data-duty-sort]').forEach(btn => {
      btn.addEventListener('click', () => {
        dutySort = btn.getAttribute('data-duty-sort');
        render();
      });
    });

    document.querySelectorAll('[data-schedule-sort]').forEach(btn => {
      btn.addEventListener('click', () => {
        scheduleSort = btn.getAttribute('data-schedule-sort');
        render();
      });
    });

    const dutyFilterSel = document.getElementById('ts-duty-filter');
    if(dutyFilterSel){
      dutyFilterSel.onchange = () => { dutyFilterId = dutyFilterSel.value; render(); };
    }

    const scheduleFilterSel = document.getElementById('ts-schedule-filter');
    if(scheduleFilterSel){
      scheduleFilterSel.onchange = () => { scheduleFilterId = scheduleFilterSel.value; render(); };
    }

    const expandAllBtn = document.getElementById('ts-expand-all');
    if(expandAllBtn){
      expandAllBtn.onclick = () => {
        const effectiveFilterId = (scheduleSort === 'calendar') ? null : (scheduleFilterId === '__me__' ? meId : scheduleFilterId);
        const visible = effectiveFilterId
          ? buildSchedule().filter(d => (data.signups[fmtDateKey(d)] || []).some(e => e.id === effectiveFilterId))
          : buildSchedule();
        visible.forEach(d => { expanded[fmtDateKey(d)] = true; });
        expandCollapseState = 'expand';
        render();
      };
    }

    const collapseAllBtn = document.getElementById('ts-collapse-all');
    if(collapseAllBtn){
      collapseAllBtn.onclick = () => {
        expanded = {};
        expandCollapseState = 'collapse';
        render();
      };
    }

    document.querySelectorAll('[data-panel-duty-key]').forEach(sel => {
      sel.addEventListener('change', async (e) => {
        if(!isAdmin) return;
        const key = sel.getAttribute('data-panel-duty-key');
        const val = sel.value;
        if(val){ data.duty[key] = val; } else { delete data.duty[key]; }
        await saveData();
        render();
      });
    });

    document.querySelectorAll('[data-confirm-key]').forEach(inp => {
      inp.addEventListener('change', async () => {
        const key = inp.getAttribute('data-confirm-key');
        const assigned = dutyForKey(key);
        const allowed = isAdmin || (meId && assigned && assigned.id === meId);
        if(!allowed) return;
        const n = parseInt(inp.value, 10);
        const signedUpEntries = data.signups[key] || [];
        const beforeConfirmedIds = splitConfirmedStandby(signedUpEntries, capacityFor(key)).confirmed.map(x => x.id);
        if(n > 0){ data.confirmedTeeTimes[key] = n; } else { delete data.confirmedTeeTimes[key]; }
        const newCapacity = capacityFor(key);
        const { confirmed: afterConfirmed, standby: afterStandby } = splitConfirmedStandby(signedUpEntries, newCapacity);
        const newlyPromoted = afterConfirmed.map(x => x.id).filter(id => !beforeConfirmedIds.includes(id));
        if(newlyPromoted.length) notifyPromoted(key, newlyPromoted);
        // Fewer tee times came back than are needed for everyone signed up — alert
        // the admin so the group can decide who sits out; the app isn't deciding.
        if(newCapacity != null && afterStandby.length > 0){
          notifyShortfall(key, signedUpEntries.length, n, newCapacity, afterStandby.map(x => x.id));
        }
        await saveData();
        render();
      });
    });

    document.querySelectorAll('[data-request-swap]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const key = btn.getAttribute('data-request-swap');
        await requestSwap(key, lastSchedule);
        render();
      });
    });

    document.querySelectorAll('[data-cancel-swap]').forEach(btn => {
      btn.addEventListener('click', async () => {
        await cancelSwap(btn.getAttribute('data-cancel-swap'));
        render();
      });
    });

    document.querySelectorAll('[data-accept-swap]').forEach(btn => {
      btn.addEventListener('click', async () => {
        await respondToSwap(btn.getAttribute('data-accept-swap'), true);
        render();
      });
    });

    document.querySelectorAll('[data-decline-swap]').forEach(btn => {
      btn.addEventListener('click', async () => {
        await respondToSwap(btn.getAttribute('data-decline-swap'), false);
        render();
      });
    });

    document.querySelectorAll('[data-expand]').forEach(row => {
      row.addEventListener('click', (e) => {
        if(e.target.closest('[data-signup-select]') || e.target.closest('[data-holes-set]') || e.target.closest('[data-tee-set]') || e.target.closest('[data-admin-remove]') || e.target.closest('[data-admin-add-key]') || e.target.closest('[data-admin-add-guest-key]') || e.target.closest('[data-confirm-key]')) return;
        const key = row.getAttribute('data-expand');
        expanded[key] = !expanded[key];
        render();
      });
    });

    document.querySelectorAll('[data-signup-select]').forEach(sel => {
      sel.addEventListener('click', e => e.stopPropagation());
      sel.addEventListener('change', async (e) => {
        e.stopPropagation();
        if(!meId) return;
        const key = sel.getAttribute('data-signup-select');
        if(data.closures[key]) return;
        const list = data.signups[key] || (data.signups[key] = []);
        const idx = list.findIndex(x => x.id === meId);
        const capacity = capacityFor(key);
        const wantIn = sel.value === 'in';
        if(wantIn && idx === -1){
          const me = data.roster.find(p => p.id === meId);
          const entry = { id: meId, holes: '18' };
          if(me && me.defaultTee) entry.tee = me.defaultTee;
          list.push(entry);
          logActivity('signup', { dateKey: key });
        } else if(!wantIn && idx !== -1){
          const beforeConfirmedIds = splitConfirmedStandby(list, capacity).confirmed.map(x => x.id);
          list.splice(idx,1);
          logActivity('dropout', { dateKey: key });
          const afterConfirmedIds = splitConfirmedStandby(list, capacity).confirmed.map(x => x.id);
          const newlyPromoted = afterConfirmedIds.filter(id => !beforeConfirmedIds.includes(id));
          if(newlyPromoted.length) notifyPromoted(key, newlyPromoted);
        } else {
          return;
        }
        // Render immediately so the change is visible right away, instead of waiting
        // on the full save round-trip (a staleness check plus the write, with retries)
        // before the UI updates — that wait was what made "I'm in" feel slow.
        render();
        await saveData();
      });
    });

    document.querySelectorAll('[data-holes-set]').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if(!meId) return;
        const [key, holes] = btn.getAttribute('data-holes-set').split('|');
        const entry = findSignup(key, meId);
        if(!entry) return;
        entry.holes = holes;
        await saveData();
        render();
      });
    });

    document.querySelectorAll('[data-tee-set]').forEach(sel => {
      sel.addEventListener('click', e => e.stopPropagation());
      sel.addEventListener('change', async (e) => {
        e.stopPropagation();
        if(!meId) return;
        const key = sel.getAttribute('data-tee-set');
        const entry = findSignup(key, meId);
        if(!entry) return;
        entry.tee = sel.value;
        await saveData();
        render();
      });
    });

    document.querySelectorAll('[data-admin-remove]').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if(!isAdmin) return;
        const [key, pid] = btn.getAttribute('data-admin-remove').split('|');
        const capacity = capacityFor(key);
        const beforeConfirmedIds = splitConfirmedStandby(data.signups[key] || [], capacity).confirmed.map(x => x.id);
        data.signups[key] = (data.signups[key] || []).filter(x => x.id !== pid);
        const afterConfirmedIds = splitConfirmedStandby(data.signups[key], capacity).confirmed.map(x => x.id);
        const newlyPromoted = afterConfirmedIds.filter(id => !beforeConfirmedIds.includes(id));
        if(newlyPromoted.length) notifyPromoted(key, newlyPromoted);
        await saveData();
        render();
      });
    });

    document.querySelectorAll('[data-admin-add-key]').forEach(sel => {
      sel.addEventListener('click', (e) => e.stopPropagation());
      sel.addEventListener('change', async (e) => {
        e.stopPropagation();
        if(!isAdmin) return;
        const key = sel.getAttribute('data-admin-add-key');
        if(data.closures[key]) return;
        const pid = sel.value;
        if(!pid) return;
        const list = data.signups[key] || (data.signups[key] = []);
        if(!list.some(x => x.id === pid)){
          list.push({ id: pid, holes: '18' });
        }
        await saveData();
        render();
      });
    });

    document.querySelectorAll('[data-admin-add-guest-key]').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if(!isAdmin) return;
        const key = btn.getAttribute('data-admin-add-guest-key');
        if(data.closures[key]) return;
        const name = await askText('Add a guest', "Enter the guest's name, or leave it blank to fill in later. They'll be added to this date only — not to your permanent roster.");
        if(name === null) return;
        const trimmed = name.trim();
        const finalName = trimmed || (() => {
          const existingGuestCount = data.roster.filter(p => p.isGuest && /^Guest( \d+)?$/.test(p.name)).length;
          return existingGuestCount === 0 ? 'Guest' : `Guest ${existingGuestCount + 1}`;
        })();
        const id = 'guest_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
        data.roster.push({ id, name: finalName, isGuest: true });
        const list = data.signups[key] || (data.signups[key] = []);
        list.push({ id, holes: '18' });
        await saveData();
        render();
      });
    });

    document.querySelectorAll('[data-close-key]').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if(!isAdmin) return;
        const key = btn.getAttribute('data-close-key');
        const reason = await askText('Mark course closed', "What's the event or reason? (optional — leave blank if you just want to mark it closed)");
        if(reason === null) return;
        data.closures[key] = reason.trim();
        await saveData();
        render();
      });
    });

    document.querySelectorAll('[data-reopen-key]').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if(!isAdmin) return;
        const key = btn.getAttribute('data-reopen-key');
        delete data.closures[key];
        await saveData();
        render();
      });
    });
  }

  (async function init(){
    await loadData();
    render();
    await autoIdentifyIfNeeded();
    render();
  })();
})();
</script>
