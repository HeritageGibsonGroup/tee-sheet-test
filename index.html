<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --fairway:#1B4332;
    --fairway-dark:#122E22;
    --ivory:#F6F1E4;
    --ivory-line:#E7DFC9;
    --brass:#B8863B;
    --brass-light:#D9B876;
    --ink:#26261F;
    --sage:#7C9A79;
    --rust:#A6432E;
    --paper-shadow: 0 1px 0 rgba(38,38,31,0.06);
  }
  *{box-sizing:border-box;}
  #tee-sheet-root{
    font-family:'Inter',sans-serif;
    background:var(--ivory);
    color:var(--ink);
    min-height:100%;
    padding:0;
    -webkit-font-smoothing:antialiased;
  }
  .ts-warn-banner{
    background:#3a2a12; color:#F6E7C9; font-size:12.5px; text-align:center; padding:9px 14px; line-height:1.5;
  }
  .ts-warn-banner b{ color:#FFD98A; }
  .ts-test-banner{
    background:repeating-linear-gradient(135deg, #7A1F1F, #7A1F1F 10px, #5C1616 10px, #5C1616 20px);
    color:#FFE9E9; font-size:12.5px; font-weight:700; letter-spacing:.04em; text-align:center;
    padding:9px 14px; line-height:1.5; text-transform:uppercase;
  }
  .ts-header{
    background:var(--fairway);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.04) 0, transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(255,255,255,0.03) 0, transparent 45%);
    color:var(--ivory);
    padding:28px 24px 22px;
    position:relative;
    overflow:hidden;
  }
  .ts-header::after{
    content:"";
    position:absolute; left:0; right:0; bottom:0; height:6px;
    background:repeating-linear-gradient(90deg, var(--brass) 0 14px, transparent 14px 28px);
    opacity:0.55;
  }
  .ts-eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--brass-light); margin:6px 0 6px;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .ts-admin-pill{
    font-family:'Inter',sans-serif; font-size:10.5px; letter-spacing:0; text-transform:none;
    background:rgba(255,255,255,0.12); color:var(--ivory); border:1px solid rgba(255,255,255,0.25);
    padding:2px 9px; border-radius:20px; cursor:pointer;
  }
  .ts-admin-pill.on{ background:var(--brass); border-color:var(--brass); color:var(--fairway-dark); font-weight:600; }
  .ts-title{
    font-family:'Fraunces',serif; font-weight:700; font-size:30px;
    margin:0; letter-spacing:-0.01em;
  }
  .ts-version{ font-size:11px; color:#9BB89A; margin:2px 0 0; font-family:'IBM Plex Mono',monospace; }
  .ts-sub{ font-size:13.5px; color:#CFE0CC; margin:6px 0 0; max-width:520px; line-height:1.5;}

  .ts-body{ max-width:760px; margin:0 auto; padding:0 20px 60px; }

  .ts-whoami{
    background:#fff; border:1px solid var(--ivory-line); border-radius:10px;
    margin-top:20px; padding:14px 16px; display:flex; align-items:center; gap:12px;
    box-shadow:0 6px 20px rgba(27,67,50,0.08); flex-wrap:wrap;
  }
  .ts-whoami label{ font-size:12px; color:#6b6a5e; font-weight:500; }
  .ts-whoami select{
    font-family:'Inter',sans-serif; font-size:14px; padding:7px 10px; border-radius:7px;
    border:1px solid var(--ivory-line); background:var(--ivory); color:var(--ink); flex:1; min-width:160px;
  }
  .ts-manage-btn{
    font-family:'Inter',sans-serif; font-size:12.5px; font-weight:500; color:var(--fairway);
    background:none; border:1px solid var(--ivory-line); padding:7px 12px; border-radius:7px; cursor:pointer;
  }
  .ts-manage-btn:hover{ background:var(--ivory); }
  .ts-pin-link{
    font-size:11.5px; color:#6b6a5e; text-decoration:underline; cursor:pointer; background:none; border:none; padding:0;
  }

  .ts-tabbar{
    display:flex; gap:10px; margin-top:20px; padding-bottom:4px;
  }
  .ts-tab{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:5px;
    font-family:'Inter',sans-serif; background:#fff; border:2px solid var(--ivory-line); border-radius:12px;
    cursor:pointer; padding:14px 8px; color:var(--fairway);
    box-shadow:0 2px 6px rgba(27,67,50,0.06); transition:all .15s ease;
  }
  .ts-tab-icon{ font-size:26px; line-height:1; }
  .ts-tab-label{ font-size:13px; font-weight:700; text-align:center; }
  .ts-tab.active{ background:var(--fairway); color:var(--ivory); border-color:var(--fairway); box-shadow:0 4px 14px rgba(27,67,50,0.22); }
  .ts-tab:hover{ border-color:var(--brass); }
  .ts-subtabbar{ display:flex; gap:6px; flex-wrap:wrap; margin-top:14px; }
  .ts-subtab{
    font-family:'Inter',sans-serif; font-size:12px; font-weight:600; color:var(--fairway);
    background:#fff; border:1.5px solid var(--ivory-line); border-radius:16px; padding:6px 13px; cursor:pointer;
  }
  .ts-subtab.active{ background:var(--brass); color:var(--fairway-dark); border-color:var(--brass); }

  .ts-reminders{ margin-top:18px; display:flex; flex-direction:column; gap:8px; }
  .ts-reminder{
    display:flex; gap:10px; align-items:flex-start; background:#FBF0EA; border:1px solid #EBCFC1;
    border-left:3px solid var(--rust); border-radius:8px; padding:11px 13px; font-size:13.5px; line-height:1.45;
  }
  .ts-reminder b{ font-weight:600; }
  .ts-reminder .flag{ font-size:15px; line-height:1.2; }

  .ts-section-title{
    font-family:'Fraunces',serif; font-weight:600; font-size:19px; margin:30px 0 12px;
    display:flex; align-items:baseline; gap:8px;
  }
  .ts-section-title span{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:#8b8a7c; font-weight:400; }

  .ts-card{
    background:#fff; border:1px solid var(--ivory-line); border-radius:10px; margin-bottom:10px;
    box-shadow:var(--paper-shadow); overflow:hidden;
  }
  .ts-card-row{
    display:flex; align-items:center; gap:14px; padding:13px 15px; cursor:pointer;
  }
  .ts-card-row:hover{ background:#FBFAF5; }
  .ts-date-block{
    font-family:'IBM Plex Mono',monospace; text-align:center; width:52px; flex-shrink:0;
    border-right:1px dashed var(--ivory-line); padding-right:12px;
  }
  .ts-date-dow{ font-size:10.5px; letter-spacing:.08em; color:var(--sage); text-transform:uppercase; }
  .ts-date-num{ font-size:20px; font-weight:500; color:var(--ink); line-height:1.1; }
  .ts-date-mon{ font-size:10px; color:#8b8a7c; text-transform:uppercase; }

  .ts-card-mid{ flex:1; min-width:0; }
  .ts-card-mid-top{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .ts-count{ font-size:14px; font-weight:600; }
  .ts-teetimes{
    font-family:'IBM Plex Mono',monospace; font-size:11px; background:var(--fairway); color:var(--ivory);
    padding:2px 7px; border-radius:20px;
  }
  .ts-teetimes.zero{ background:#e6e2d4; color:#8b8a7c; }
  .ts-duty{ font-size:12px; color:#6b6a5e; margin-top:3px; display:flex; align-items:center; gap:5px;}
  .ts-duty .golf-flag{ color:var(--brass); }
  .ts-duty-select{
    font-family:'Inter',sans-serif; font-size:12px; color:#6b6a5e; background:var(--ivory);
    border:1px solid var(--ivory-line); border-radius:6px; padding:2px 6px; max-width:120px;
  }
  .ts-duty-static{ font-weight:500; }
  .ts-duty-lock{
    font-size:10.5px; color:#a3a293; background:none; border:none; cursor:pointer; text-decoration:underline; padding:0;
  }
  .ts-duty-window{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; padding:1px 6px; border-radius:5px;
  }
  .win-open{ background:#E4EFE1; color:#3E6B3A; }
  .win-soon{ background:#FBF0EA; color:var(--rust); }
  .win-later{ background:#F0EEE3; color:#8b8a7c; }

  .ts-toggle-wrap{ display:flex; flex-direction:column; align-items:flex-end; gap:5px; flex-shrink:0; }
  .ts-card.closed{ background:#FBF7F0; }
  .ts-closed-line{ display:flex; align-items:center; gap:8px; }
  .closed-flag{ font-size:15px; }
  .closed-text{ font-size:13.5px; font-weight:600; color:var(--rust); }
  .ts-closed-toggle-label{
    flex-shrink:0; font-family:'Inter',sans-serif; font-size:12px; font-weight:600; color:#a3a293;
    padding:8px 12px; border:1.5px dashed #d8d4c4; border-radius:20px;
  }
  .ts-closure-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 0; border-bottom:1px dashed var(--ivory-line); font-size:13px;
  }
  .ts-closure-row:last-of-type{ border-bottom:none; }
  .ts-closure-date{ color:var(--ink); flex-shrink:0; }
  .ts-closure-status{ font-size:11.5px; color:#8b8a7c; flex:1; text-align:right; margin-right:6px; }
  .ts-closure-status.closed{ color:var(--rust); font-weight:600; }
  .ts-closure-row button{
    font-family:'Inter',sans-serif; font-size:11px; font-weight:600; color:var(--fairway);
    background:#fff; border:1px solid var(--fairway); border-radius:14px; padding:3px 10px; cursor:pointer; flex-shrink:0;
  }
  .ts-signup-select{
    font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600; padding:8px 10px;
    border-radius:20px; border:1.5px solid var(--fairway); background:#fff; color:var(--fairway); cursor:pointer;
    transition:all .12s ease;
  }
  .ts-signup-select.in{ background:var(--fairway); color:var(--ivory); }
  .ts-signup-select.standby{ background:var(--brass); border-color:var(--brass); color:var(--ivory); }
  .ts-standby-count{ color:var(--brass); font-weight:600; }
  .ts-chip-group-label{
    font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--sage); margin:6px 0 4px;
  }
  .ts-chip-group-label:first-child{ margin-top:0; }
  .ts-chip-group-label.standby{ color:var(--brass); }
  .ts-teams-block{ margin-top:12px; padding-top:10px; border-top:1px dashed var(--ivory-line); }
  .ts-team-row{ margin-bottom:8px; }
  .ts-team-num{
    display:block; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.06em;
    text-transform:uppercase; color:var(--fairway); margin-bottom:4px;
  }
  .ts-team-so{ color:#8b8a7c; font-size:10.5px; }
  .ts-score-table{ border-collapse:collapse; font-family:'IBM Plex Mono',monospace; }
  .ts-score-table th, .ts-score-table td{ text-align:center; padding:3px 2px; }
  .ts-score-table thead th{ font-size:10px; font-weight:600; color:#8b8a7c; }
  .ts-score-table thead tr:first-child th{ font-size:9.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--fairway); padding-bottom:4px; }
  .ts-score-table td.ts-score-name, .ts-score-table th:first-child{ text-align:left; padding-right:10px; white-space:nowrap; font-family:'Inter',sans-serif; font-size:12.5px; }
  .ts-score-table th:nth-child(8), .ts-score-table td:nth-child(8),
  .ts-score-table th:nth-child(14), .ts-score-table td:nth-child(14){ border-left:2px solid var(--ivory-line); }
  .ts-score-input{
    width:30px; font-family:'IBM Plex Mono',monospace; font-size:12.5px; text-align:center;
    padding:4px 2px; border-radius:5px; border:1px solid var(--ivory-line);
  }
  .ts-score-table td.ts-score-stroke{ background:#FBF3E4; }
  .ts-score-table td.ts-score-stroke .ts-score-input{ border-color:var(--brass); }
  .ts-hh-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .ts-hh-cell{ display:flex; flex-direction:column; align-items:center; gap:2px; width:38px; }
  .ts-hh-cell label{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:#8b8a7c; }
  .ts-hh-cell input{
    width:34px; font-family:'IBM Plex Mono',monospace; font-size:12.5px; text-align:center;
    padding:4px 2px; border-radius:5px; border:1px solid var(--ivory-line);
  }
  .ts-bet-row{ display:flex; justify-content:space-between; gap:10px; padding:5px 0; border-bottom:1px solid var(--ivory-line); font-size:12.5px; }
  .ts-bet-row:last-child{ border-bottom:none; }
  .ts-bet-row .ts-bet-label{ color:var(--ink); }
  .ts-bet-row .ts-bet-result{ font-family:'IBM Plex Mono',monospace; color:#6b6a5e; white-space:nowrap; }
  .ts-holes-group{ display:flex; gap:4px; }
  .ts-holes-pill{
    font-family:'IBM Plex Mono',monospace; font-size:10px; color:#8b8a7c; background:#fff;
    border:1px solid var(--ivory-line); border-radius:12px; padding:3px 8px; cursor:pointer;
  }
  .ts-holes-pill.active{ color:var(--brass); background:#FBF3E4; border-color:#EAD6A8; font-weight:600; }
  .ts-tee-select{
    font-family:'Inter',sans-serif; font-size:11px; color:#6b6a5e; background:#fff;
    border:1px solid var(--ivory-line); border-radius:12px; padding:3px 6px; margin-top:4px;
  }

  .ts-players{
    padding:0 15px 14px 81px; font-size:12.5px; color:#6b6a5e; line-height:1.6; display:none;
  }
  .ts-players.open{ display:block; }
  .ts-players .name-chip{
    display:inline-block; background:var(--ivory); border:1px solid var(--ivory-line); border-radius:20px;
    padding:2px 9px; margin:2px 4px 2px 0; font-size:12px;
  }
  .ts-players .name-chip.me{ border-color:var(--brass); background:#FBF3E4; font-weight:600; color:#7A5A20; }
  .ts-players .name-chip .holes-badge{
    font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--rust); margin-left:4px;
  }
  .ts-guest-badge{
    font-family:'Inter',sans-serif; font-size:9.5px; font-weight:700; text-transform:uppercase;
    letter-spacing:.03em; color:var(--brass); background:#FBF3E4; border-radius:6px; padding:1px 5px; margin-left:4px;
  }
  .ts-admin-toggle-label{
    display:flex; align-items:center; gap:4px; font-family:'Inter',sans-serif; font-size:12px; color:#6b6a5e; white-space:nowrap;
  }
  .name-chip .chip-remove{
    background:none; border:none; color:#a3a293; cursor:pointer; font-size:13px; padding:0 0 0 5px; line-height:1;
  }
  .name-chip .chip-remove:hover{ color:var(--rust); }
  .ts-admin-add{ margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .ts-admin-add-select{
    font-family:'Inter',sans-serif; font-size:12px; color:var(--fairway); background:#EEF4EC;
    border:1px solid #CFE0CC; border-radius:16px; padding:4px 10px;
  }
  .ts-admin-add-guest-btn{
    font-family:'Inter',sans-serif; font-size:12px; color:var(--brass); background:#FBF3E4;
    border:1px solid #EAD6A8; border-radius:16px; padding:4px 10px; cursor:pointer;
  }
  .ts-empty{ font-style:italic; color:#a3a293; }

  .ts-booking-alert{
    display:flex; gap:9px; align-items:flex-start; background:#FBF0EA; border:1px solid #EBCFC1;
    border-left:3px solid var(--rust); border-radius:8px; padding:10px 12px; font-size:12.5px; line-height:1.5;
    margin:2px 0 10px;
  }
  .ts-booking-alert b{ font-weight:600; }
  .ts-booking-alert .flag{ font-size:14px; line-height:1.3; }
  .ts-booking-alert.unassigned{ background:#F0EEE3; border-color:var(--ivory-line); border-left-color:#c9c6b4; color:#6b6a5e; }

  .ts-roster-panel{
    background:#fff; border:1px solid var(--ivory-line); border-radius:10px; padding:16px; margin-top:16px;
  }
  .ts-roster-panel h4{ font-family:'Fraunces',serif; font-size:15px; margin:0 0 10px; }
  .ts-roster-row{ display:flex; align-items:center; gap:10px; margin-bottom:8px; flex-wrap:wrap; }
  .ts-roster-row input{
    flex:1; min-width:110px; font-family:'Inter'; font-size:13.5px; padding:7px 10px; border-radius:7px; border:1px solid var(--ivory-line);
  }
  .ts-roster-row button{
    background:none; border:none; color:var(--rust); cursor:pointer; font-size:13px; padding:4px 8px;
  }
  .ts-pin-status{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:#a3a293; flex-shrink:0; white-space:nowrap;
  }
  .ts-pin-status.set{ color:var(--fairway); font-weight:600; }
  .ts-add-row{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .ts-add-row input{
    flex:1; min-width:110px; font-family:'Inter'; font-size:13.5px; padding:8px 10px; border-radius:7px; border:1px solid var(--ivory-line);
  }
  .ts-add-row button{
    background:var(--fairway); color:var(--ivory); border:none; padding:8px 14px; border-radius:7px;
    font-size:13px; font-weight:600; cursor:pointer;
  }
  .ts-import-row{
    margin-top:14px; padding-top:14px; border-top:1px dashed var(--ivory-line);
  }
  .ts-import-row button{
    background:#fff; color:var(--fairway); border:1.5px solid var(--fairway); padding:8px 14px; border-radius:7px;
    font-size:13px; font-weight:600; cursor:pointer;
  }
  .ts-import-row-label{
    display:inline-block; font-family:'Inter',sans-serif; color:var(--fairway); font-size:13px; font-weight:600; margin:0 0 6px;
  }
  .ts-import-row p{ font-size:12px; color:#8b8a7c; margin:6px 0 0; line-height:1.5; }
  .ts-note{
    font-size:12px; color:#8b8a7c; margin-top:10px; line-height:1.5; border-top:1px dashed var(--ivory-line); padding-top:10px;
  }
  .ts-locked-panel{
    text-align:center; padding:22px; color:#6b6a5e; font-size:13.5px;
  }
  .ts-locked-panel button{
    margin-top:10px; background:var(--fairway); color:var(--ivory); border:none; padding:8px 16px; border-radius:7px;
    font-size:13px; font-weight:600; cursor:pointer;
  }
  .ts-duty-controls{
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    margin-top:14px; padding-top:14px; border-top:1px dashed var(--ivory-line);
  }
  .ts-duty-sort{ display:flex; gap:6px; }
  .ts-duty-sort-btn{
    font-family:'Inter',sans-serif; font-size:12px; font-weight:500; color:#6b6a5e;
    background:var(--ivory); border:1px solid var(--ivory-line); border-radius:16px; padding:6px 12px; cursor:pointer;
  }
  .ts-duty-sort-btn.active{ background:var(--fairway); color:var(--ivory); border-color:var(--fairway); font-weight:600; }
  .ts-duty-sort-btn.subtle-active{ background:#E4EFE1; color:#3E6B3A; border-color:#C9DDC5; }
  #ts-duty-filter{
    font-family:'Inter',sans-serif; font-size:12.5px; padding:6px 10px; border-radius:7px;
    border:1px solid var(--ivory-line); background:#fff; color:var(--ink);
  }
  .ts-duty-panel{ margin-top:16px; }
  .ts-cal-grid{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; align-items:start; margin-top:10px;
  }
  .ts-cal-header{
    font-family:'Fraunces',serif; font-size:16px; font-weight:700; letter-spacing:.01em;
    color:var(--ivory); text-align:center; padding:8px 4px; background:var(--fairway);
    border-radius:8px; position:sticky; top:0;
  }
  .ts-cal-cell .ts-card{ margin-bottom:0; }
  .ts-cal-blank{ visibility:hidden; }
  .ts-duty-cal-entry{
    font-family:'Inter',sans-serif; font-size:12.5px; padding:10px 12px; background:#fff;
    border:1px solid var(--ivory-line); border-radius:8px;
  }
  .ts-duty-cal-date{ font-family:'IBM Plex Mono',monospace; color:#8b8a7c; }
  .ts-duty-cal-name{ font-weight:600; color:var(--ink); }
  .ts-duty-cal-entry.closed{ text-decoration:line-through; opacity:.6; }
  .ts-grid-disclaimer{ font-size:12px; color:#8b8a7c; font-style:italic; margin:10px 0 0; }
  .ts-grid-wrap{ overflow-x:auto; margin-top:10px; border:1px solid var(--ivory-line); border-radius:8px; }
  .ts-grid-table{ border-collapse:collapse; width:100%; font-size:12px; font-family:'Inter',sans-serif; }
  .ts-grid-table th, .ts-grid-table td{
    border:1px solid var(--ivory-line); padding:5px 8px; white-space:nowrap; text-align:left;
  }
  .ts-grid-table thead th{
    background:var(--fairway); color:var(--ivory); font-family:'IBM Plex Mono',monospace;
    font-size:10.5px; letter-spacing:.04em; text-transform:uppercase; position:sticky; top:0;
  }
  .ts-grid-date{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink); background:#FBFAF5; }
  .ts-grid-closed{ color:var(--rust); font-style:italic; text-align:center; }
  @media (max-width:640px){

<div id="tee-sheet-root">
  <div class="ts-loading" id="ts-loading">setting the tee sheet…</div>
</div>
<div id="ts-modal-root"></div>

<script>
(function(){
  const root = document.getElementById('tee-sheet-root');
  // Auto-detects which environment this is running as, based on the URL —
  // so the exact same file can be uploaded to both the test and live GitHub
  // repos, and each will safely connect to its own backend and data.
  // Defaults to TEST unless the URL clearly matches the live site, since
  // that's the safer default (e.g. when opened as a local file for testing).
  const IS_LIVE_ENV = window.location.pathname.includes('tee-sheet-live') || window.location.hostname.includes('tee-sheet-live');
  const IS_TEST_ENV = !IS_LIVE_ENV;

  const BACKEND_URL = IS_LIVE_ENV
    ? 'https://script.google.com/macros/s/AKfycbzkKxBkARjT_5rVtGrHo7SIlJnTaHJ09juHOTGkdhY44Pt2hMNdotuftauRgLMtbiNLiQ/exec'
    : 'https://script.google.com/macros/s/AKfycbw2DXbcsX-ORzaZlv0WM7GXFBNaWcu3tqM_VvCu0OyxbxL0rJyLeBNqeJe_1mjB56Tbfw/exec';
  const BACKEND_KEY = IS_LIVE_ENV ? 'YwlubntDPMdjkcMe' : 'qdQ5OcCYA5gT';
  const ME_KEY = IS_LIVE_ENV ? 'golf-league-me' : 'golf-league-me-TEST';
  const ADMIN_UNLOCK_KEY = IS_LIVE_ENV ? 'golf-league-admin-unlocked' : 'golf-league-admin-unlocked-TEST';
  const VERIFIED_KEY = IS_LIVE_ENV ? 'golf-league-verified-players' : 'golf-league-verified-players-TEST';
  const PLAYERS_PER_TEE_TIME = 4;
  const PRO_SHOP_EMAILS = ['rdelfs@theheritageclub.net', 'rsatterwhite@theheritageclub.net'];
  // Extra CC on just the "playing tomorrow" reminder (not the pro-shop duty one).
  const GOLF_TOMORROW_EXTRA_CC = ['stevekirchhoff52@gmail.com', 'rtleene@aol.com'];
  const BOOKING_WINDOW_DAYS = 14; // club allows booking 2 weeks ahead
  const WEEKS_AHEAD = 52;
  const VERSION_DATE = 'August 31, 2026'; // update this each time a change is promoted to live
  const PLAY_DOWS = [1,3,5]; // Mon, Wed, Fri
  const HOLES_CYCLE = ['18','F9','B9'];
  const HOLES_LABEL = { '18': '18 holes', 'F9': 'Front 9', 'B9': 'Back 9' };

  const HOLES_SHORT = { '18': '', 'F9': 'F9', 'B9': 'B9' };
  const HOLES_PILL_LABEL = { '18': '18', 'F9': 'Front 9', 'B9': 'Back 9' };

  // Scoring & betting: the round is split into 3 series of 6 holes each,
  // with a $ stake per series (both admin-configurable per date).
  const NUM_SERIES = 3;
  const HOLES_PER_SERIES = 6;

  // --- backend: a Google Apps Script Web App backed by a Google Sheet plays the
  // role Claude's window.storage used to play. Personal, per-device data (who you
  // are, whether you're unlocked as admin) lives in this browser's own localStorage
  // instead, since there's no need for that to be shared or synced.
  const storageAvailable = true; // this app always has somewhere to save, once deployed

  async function fetchSharedData(){
    const url = `${BACKEND_URL}?key=${encodeURIComponent(BACKEND_KEY)}`;
    const res = await fetch(url);
    const text = await res.text();
    return JSON.parse(text);
  }

  async function saveSharedData(obj){
    const url = `${BACKEND_URL}?key=${encodeURIComponent(BACKEND_KEY)}`;
    // Content-Type text/plain avoids a CORS preflight that Apps Script Web Apps
    // don't handle well — the server still parses the body as JSON regardless.
    await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(obj)
    });
  }

  // Asks the Apps Script backend to email whoever just got promoted off
  // standby — the backend does the actual sending (client JS can't send mail
  // directly). Fails silently if the network hiccups; this is a nice-to-have
  // notification, not something that should block the signup change itself.
  async function notifyPromoted(dateKey, playerIds){
    try{
      const url = `${BACKEND_URL}?key=${encodeURIComponent(BACKEND_KEY)}&action=notify_promotion`;
      await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ dateKey, playerIds })
      });
    }catch(e){ /* best-effort */ }
  }

  // Fires once, right when a confirmed-tee-times count is entered/changed and it
  // turns out to be short of what's needed — this is the "we got fewer tee times
  // than we need" moment. The app doesn't decide who drops out; it just alerts
  // the admin so the group can work it out. standbyIds is who the app's own
  // signup-order placeholder currently has sitting out, for context only.
  async function notifyShortfall(dateKey, signedUpCount, confirmedTeeTimes, capacity, standbyIds){
    try{
      const url = `${BACKEND_URL}?key=${encodeURIComponent(BACKEND_KEY)}&action=notify_shortfall`;
      await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ dateKey, signedUpCount, confirmedTeeTimes, capacity, standbyIds })
      });
    }catch(e){ /* best-effort */ }
  }

  // Records a player-driven change (signup, drop-out, duty swap) into
  // data.activityLog, so the nightly digest (sendDailyActivityDigest in the
  // backend) can email the admin a list of what happened the day before. Just
  // mutates local data — rides along with whatever saveData() call the caller
  // already makes right after, no extra network round trip of its own.
  function logActivity(type, extra){
    if(!data.activityLog) data.activityLog = [];
    const me = meId ? data.roster.find(p => p.id === meId) : null;
    data.activityLog.push(Object.assign({
      ts: Date.now(),
      type,
      playerId: meId,
      playerName: me ? me.name : 'Unknown'
    }, extra || {}));
  }

  // Score entry and round setup go through their own narrow backend actions
  // (instead of the whole-blob saveData()) because during a round several
  // scorekeepers may be saving around the same time — the backend
  // lock-serializes these and merges just the one hole/setting, so one
  // group's entry can't silently clobber another's the way a full-blob
  // overwrite could. The server's returned round object is authoritative.
  async function saveScore(dateKey, playerId, holeNum, strokes){
    ensureRoundDefaults(dateKey);
    if(typeof strokes === 'number' && strokes > 0){
      if(!data.rounds[dateKey].scores[playerId]) data.rounds[dateKey].scores[playerId] = {};
      data.rounds[dateKey].scores[playerId][String(holeNum)] = strokes;
    } else if(data.rounds[dateKey].scores[playerId]){
      delete data.rounds[dateKey].scores[playerId][String(holeNum)];
    }
    try{
      const url = `${BACKEND_URL}?key=${encodeURIComponent(BACKEND_KEY)}&action=save_score`;
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ dateKey, playerId, holeNum: String(holeNum), strokes })
      });
      const parsed = JSON.parse(await res.text());
      if(parsed && parsed.round){
        data.rounds[dateKey] = parsed.round;
        if(typeof parsed.lastModified === 'number'){ data._lastModified = parsed.lastModified; lastKnownModified = parsed.lastModified; }
      }
    }catch(e){ /* optimistic local edit stands; will reconcile next load */ }
  }

  async function saveRoundSettings(dateKey, patch){
    ensureRoundDefaults(dateKey);
    Object.assign(data.rounds[dateKey], patch);
    try{
      const url = `${BACKEND_URL}?key=${encodeURIComponent(BACKEND_KEY)}&action=save_round_settings`;
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ dateKey, patch })
      });
      const parsed = JSON.parse(await res.text());
      if(parsed && parsed.round){
        data.rounds[dateKey] = parsed.round;
        if(typeof parsed.lastModified === 'number'){ data._lastModified = parsed.lastModified; lastKnownModified = parsed.lastModified; }
      }
    }catch(e){ /* best-effort */ }
  }

  let data = { roster: [], signups: {}, duty: {}, closures: {}, swapRequests: {}, confirmedTeeTimes: {}, teeTimeSchedule: {}, teeRatings: {}, teeOptions: [], teams: {}, rounds: {}, holeHandicaps: {}, adminPin: null, playerPins: {}, activityLog: [] };
  let meId = null;
  let lastKnownModified = 0;
  let isAdmin = false;
  let verifiedPlayers = [];
  let expanded = {};
  let expandCollapseState = null; // 'expand' | 'collapse' | null — just for the subtle indicator
  let activeSection = 'schedule'; // 'schedule' | 'duty' | 'admin'
  let adminSubTab = 'roster'; // 'roster' | 'closures' | 'data' | 'reminders' | 'handicaps' | 'scoring'
  let scoringSelectedDate = null; // dateKey currently shown on the Scoring & Bets tab
  let dutySort = 'date'; // 'date' | 'person'
  let dutyFilterId = ''; // '' = everyone, '__me__' = current identity, or a player id
  let scheduleFilterId = ''; // same idea, for the Upcoming Dates list
  let scheduleSort = 'date'; // 'date' | 'person'
  let lastSchedule = [];

  const DOW_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const MON_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function fmtDateKey(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function daysBetween(a,b){
    const MS = 24*60*60*1000;
    const da = new Date(a.getFullYear(),a.getMonth(),a.getDate());
    const db = new Date(b.getFullYear(),b.getMonth(),b.getDate());
    return Math.round((db-da)/MS);
  }

  function buildSchedule(){
    const dates = [];
    const start = new Date();
    start.setHours(0,0,0,0);
    let cursor = new Date(start);
    while(dates.length < WEEKS_AHEAD*PLAY_DOWS.length){
      if(PLAY_DOWS.includes(cursor.getDay())){
        dates.push(new Date(cursor));
      }
      cursor.setDate(cursor.getDate()+1);
    }
    return dates;
  }

  // Signups are stored as { dateKey: [{id, holes}, ...] }. Older data (or a stray
  // manual edit) might have plain id strings instead of objects — normalize on load.
  function normalizeSignups(){
    Object.keys(data.signups).forEach(k => {
      data.signups[k] = (data.signups[k] || []).map(entry => {
        if(typeof entry === 'string') return { id: entry, holes: '18' };
        if(entry && entry.id) return { id: entry.id, holes: HOLES_CYCLE.includes(entry.holes) ? entry.holes : '18' };
        return null;
      }).filter(Boolean);
    });
  }

  async function loadData(){
    try{
      const fetched = await fetchSharedData();
      if(fetched && typeof fetched === 'object' && !fetched.error){ data = fetched; }
    }catch(e){ /* no data yet, or network hiccup — fall back to defaults */ }
    if(!data.roster) data.roster = [];
    if(!data.signups) data.signups = {};
    if(!data.duty) data.duty = {};
    if(!data.closures) data.closures = {};
    if(!data.swapRequests) data.swapRequests = {};
    if(!data.confirmedTeeTimes) data.confirmedTeeTimes = {};
    if(!data.teeTimeSchedule) data.teeTimeSchedule = {};
    if(!data.teeRatings) data.teeRatings = {};
    if(!data.teeOptions) data.teeOptions = [];
    if(!data.teams) data.teams = {};
    if(!data.rounds) data.rounds = {};
    if(!data.holeHandicaps) data.holeHandicaps = {};
    if(!data.playerPins) data.playerPins = {};
    if(typeof data.adminPin === 'undefined') data.adminPin = null;
    if(!data.activityLog) data.activityLog = [];
    if(typeof data._lastModified !== 'number') data._lastModified = 0;
    lastKnownModified = data._lastModified;
    normalizeSignups();
    try{ meId = localStorage.getItem(ME_KEY) || null; }catch(e){ meId = null; }
    try{ isAdmin = localStorage.getItem(ADMIN_UNLOCK_KEY) === 'true'; }catch(e){ isAdmin = false; }
    // A player granted admin privilege on their roster record gets it automatically
    // once identified — no need to know the shared master PIN.
    if(meId){
      const me = data.roster.find(p => p.id === meId);
      if(me && me.isAdmin) isAdmin = true;
    }
    try{
      const ver = localStorage.getItem(VERIFIED_KEY);
      verifiedPlayers = ver ? JSON.parse(ver) : [];
    }catch(e){ verifiedPlayers = []; }
  }

  // Before writing, check whether the server's data has changed since we last
  // loaded or saved it — e.g. from the nightly automation, or someone else's
  // edit. If so, warn instead of silently overwriting their change. Returns
  // true if the save should proceed, false if the caller should abort.
  async function checkNotStale(){
    try{
      const fresh = await fetchSharedData();
      const freshModified = (fresh && typeof fresh._lastModified === 'number') ? fresh._lastModified : 0;
      if(freshModified !== lastKnownModified){
        const proceed = await askConfirm(
          'This has changed elsewhere',
          "The data has been updated since you loaded this page — possibly by the automated team emails, or someone else. Reloading first is strongly recommended so you don't overwrite their change. Reload now, or continue anyway at your own risk?",
          'Continue anyway (risky)',
          'Reload now'
        );
        if(!proceed){
          window.location.reload();
          return false;
        }
      }
    }catch(e){ /* if the check itself fails, don't block saving over a network hiccup */ }
    return true;
  }

  async function saveData(){
    const ok = await checkNotStale();
    if(!ok) return;
    data._lastModified = Date.now();
    const maxAttempts = 3;
    for(let attempt = 1; attempt <= maxAttempts; attempt++){
      try{
        await saveSharedData(data);
        lastKnownModified = data._lastModified;
        return;
      }catch(e){
        if(attempt === maxAttempts){
          console.error('Could not save after ' + maxAttempts + ' attempts', e);
        }else{
          await new Promise(r => setTimeout(r, 400 * attempt));
        }
      }
    }
  }
  async function persistMe(id){
    meId = id;
    try{ localStorage.setItem(ME_KEY, id || ''); }catch(e){}
  }
  async function persistAdmin(flag){
    isAdmin = flag;
    try{ localStorage.setItem(ADMIN_UNLOCK_KEY, flag ? 'true' : 'false'); }catch(e){}
  }
  async function persistVerified(){
    try{ localStorage.setItem(VERIFIED_KEY, JSON.stringify(verifiedPlayers)); }catch(e){}
  }

  function dutyForKey(key){
    const id = data.duty[key];
    if(!id) return null;
    return data.roster.find(p => p.id === id) || null;
  }

  function lastNameOf(name){
    const parts = name.trim().split(/\s+/);
    return parts[parts.length - 1];
  }

  function sortedRoster(){
    return [...data.roster].sort((a,b) => {
      const cmp = lastNameOf(a.name).localeCompare(lastNameOf(b.name));
      return cmp !== 0 ? cmp : a.name.localeCompare(b.name);
    });
  }

  // Once tee times are confirmed for a date, that locks in a hard capacity (4 players
  // per tee time). Anyone signed up beyond that, by signup order, is on standby — and
  // since it's purely positional, someone dropping out automatically bumps the next
  // standby player into a confirmed spot on the next render. No manual promotion needed.
  function capacityFor(key){
    const n = data.confirmedTeeTimes[key];
    return (typeof n === 'number' && n > 0) ? n * PLAYERS_PER_TEE_TIME : null;
  }
  function splitConfirmedStandby(entries, capacity){
    if(capacity == null) return { confirmed: entries, standby: [] };
    return { confirmed: entries.slice(0, capacity), standby: entries.slice(capacity) };
  }

  // First tee times change a few times a year and then hold steady — admin enters each
  // change as "effective from this date," and this looks up whichever change most
  // recently took effect on or before the given date, and holds it there indefinitely.
  function firstTeeTimeFor(dateKey){
    const keys = Object.keys(data.teeTimeSchedule).filter(k => k <= dateKey).sort();
    if(keys.length === 0) return null;
    return data.teeTimeSchedule[keys[keys.length-1]];
  }
  function parseTimeString(s){
    const m = String(s).trim().match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
    if(!m) return null;
    let hours = parseInt(m[1],10);
    const minutes = parseInt(m[2],10);
    const ampm = m[3].toUpperCase();
    if(ampm === 'PM' && hours !== 12) hours += 12;
    if(ampm === 'AM' && hours === 12) hours = 0;
    return hours*60 + minutes;
  }
  function formatMinutesAsTime(total){
    total = ((total % 1440) + 1440) % 1440;
    const hours = Math.floor(total/60);
    const minutes = total % 60;
    const ampm = hours >= 12 ? 'PM' : 'AM';
    let h12 = hours % 12; if(h12 === 0) h12 = 12;
    return `${h12}:${String(minutes).padStart(2,'0')} ${ampm}`;
  }
  function arrivalTimeFor(dateKey){
    const first = firstTeeTimeFor(dateKey);
    if(!first) return null;
    const mins = parseTimeString(first);
    if(mins === null) return null;
    return formatMinutesAsTime(mins - 120);
  }

  // --- admin gate: roster management, duty assignment, and importing are locked behind
  // a single admin PIN (set once by whoever runs the league). Anyone can view; only an
  // unlocked browser can edit those things.
  async function requireAdmin(){
    if(isAdmin) return true;
    if(!data.adminPin){
      const setPin = await askText('Set an admin PIN', "You'll use this to edit the roster, booking duty, and imports from any device.");
      if(setPin === null) return false;
      const trimmed = setPin.trim();
      if(!trimmed){ await showMessage('PIN cannot be empty', 'Please enter at least one character.'); return false; }
      data.adminPin = trimmed;
      await saveData();
      await persistAdmin(true);
      return true;
    }
    const entered = await askText('Admin PIN', 'Enter the admin PIN to edit this.');
    if(entered === null) return false;
    if(entered.trim() === data.adminPin){
      await persistAdmin(true);
      return true;
    }
    await showMessage('Incorrect PIN', 'That PIN doesn\'t match. Try again.');
    return false;
  }

  // --- per-player gate: if a player has set a PIN, selecting their name requires it
  // (once per device). Setting a PIN is optional and left to each player.
  async function verifyPlayerSelection(id){
    if(!id) return true;
    if(isAdmin) return true;
    if(verifiedPlayers.includes(id)) return true;
    const pin = data.playerPins[id];
    if(!pin) return await forceSetPin(id);
    const entered = await askText('Enter your PIN', 'Enter your PIN to sign in as this player.');
    if(entered === null) return false;
    if(entered.trim() === pin){
      verifiedPlayers.push(id);
      await persistVerified();
      return true;
    }
    await showMessage('Incorrect PIN', 'That PIN doesn\'t match. Try again.');
    return false;
  }

  // First time anyone signs in as a given player, they must set a 4-digit PIN before
  // proceeding — this protects their signups from anyone else picking their name.
  async function forceSetPin(id){
    while(true){
      const entered = await askText('Set a 4-digit PIN', "This is your first time signing in as this player. Choose a 4-digit PIN — you'll need it again on other devices.");
      if(entered === null) return false; // they backed out; stays unidentified, can retry anytime
      const trimmed = entered.trim();
      if(!/^\d{4}$/.test(trimmed)){
        await showMessage('Needs to be 4 digits', 'Enter exactly 4 numbers, like 1234.');
        continue;
      }
      data.playerPins[id] = trimmed;
      verifiedPlayers.push(id);
      await persistVerified();
      await saveData();
      return true;
    }
  }

  // Builds ready-to-send reminder emails (as CSV rows) for anyone playing tomorrow, or on
  // pro-shop duty today. This doesn't send anything — it's meant to be exported and fed to
  // a separate scheduled script (e.g. via Windows Task Scheduler) that actually sends mail.
  function buildEmailReminders(){
    const schedule = buildSchedule();
    const today = new Date(); today.setHours(0,0,0,0);
    const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate()+1);
    const tomorrowKey = fmtDateKey(tomorrow);
    const rows = [];

    // Playing tomorrow — one email, everyone playing CC'd together
    const tmrDate = schedule.find(d => fmtDateKey(d) === tomorrowKey);
    if(tmrDate && !data.closures[tomorrowKey]){
      const capacity = capacityFor(tomorrowKey);
      const entries = data.signups[tomorrowKey] || [];
      const { confirmed } = splitConfirmedStandby(entries, capacity);
      const playingList = capacity != null ? confirmed : entries;
      const withEmail = playingList
        .map(entry => ({ entry, p: data.roster.find(r => r.id === entry.id) }))
        .filter(x => x.p && x.p.email);
      if(withEmail.length){
        const dateLabel = `${DOW_NAMES[tmrDate.getDay()]} ${MON_NAMES[tmrDate.getMonth()]} ${tmrDate.getDate()}`;
        const nameLines = withEmail.map(({entry, p}) => {
          const holesNote = entry.holes !== '18' ? ` (${HOLES_LABEL[entry.holes]})` : '';
          return `- ${p.name}${holesNote}`;
        }).join('\n');
        rows.push({
          cc: withEmail.map(x => x.p.email).concat(PRO_SHOP_EMAILS).concat(GOLF_TOMORROW_EXTRA_CC).join(','),
          subject: `Reminder: golf tomorrow, ${dateLabel}`,
          body: `Hi. This message is being sent to you via the Gibson Group's Scheduling app to remind you that the following are signed up to play tomorrow, ${dateLabel}. Hit 'em straight!\n\n${nameLines}`
        });
      }
    }

    // Pro-shop duty tomorrow — one email, everyone with a duty date tomorrow CC'd together
    const dutyReminders = [];
    schedule.forEach(d => {
      const key = fmtDateKey(d);
      const duty = dutyForKey(key);
      if(!duty || !duty.email || data.closures[key]) return;
      const bookOpenDate = new Date(d); bookOpenDate.setDate(bookOpenDate.getDate() - BOOKING_WINDOW_DAYS);
      if(daysBetween(today, bookOpenDate) !== 1) return;
      const count = (data.signups[key] || []).length;
      const tt = count > 0 ? Math.ceil(count/PLAYERS_PER_TEE_TIME) : 0;
      const arrival = arrivalTimeFor(fmtDateKey(bookOpenDate));
      dutyReminders.push({ duty, d, tt, arrival });
    });
    if(dutyReminders.length){
      const nameLines = dutyReminders.map(({duty, d, tt, arrival}) => {
        const dateLabel = `${DOW_NAMES[d.getDay()]} ${MON_NAMES[d.getMonth()]} ${d.getDate()}`;
        const arrivalNote = arrival ? ` (arrive at ${arrival})` : '';
        return `- ${duty.name}: request ${tt || '?'} tee time${tt===1?'':'s'} for ${dateLabel}${arrivalNote}`;
      }).join('\n');
      rows.push({
        cc: dutyReminders.map(x => x.duty.email).join(','),
        subject: `Reminder: pro shop visit tomorrow`,
        body: `Reminder — you have pro-shop duty tomorrow:\n\n${nameLines}`
      });
    }

    return rows;
  }

  function firstNameOf(name){

  // Snake-draft team balancing for the next play day. Uses each player's tee for
  // THAT round (their signup's own tee choice if set, else their profile default),
  // and whoever has the lowest course handicap among just the people playing that
  // day (not the whole roster) is who plays to scratch — matching real handicap play.
  function courseHandicapFor(player, tee){
    if(!player || !tee || !player.courseHandicaps) return null;
    const v = player.courseHandicaps[tee];
    return typeof v === 'number' ? v : null;
  }

  function computeTeamsForDate(dateKey){
    const entries = data.signups[dateKey] || [];
    const capacity = capacityFor(dateKey);
    const { confirmed } = splitConfirmedStandby(entries, capacity);
    const playing = confirmed.length ? confirmed : entries; // fall back to everyone signed up if no cap set yet

    // Only full 18-hole rounds count toward the team bet.
    const eighteenHoleEntries = playing.filter(e => e.holes === '18');
    const nineHoleOut = playing.filter(e => e.holes !== '18').map(entry => {
      const p = data.roster.find(r => r.id === entry.id);
      return p ? { id: p.id, name: p.name, reason: `Playing ${HOLES_LABEL[entry.holes] || 'nine'}` } : null;
    }).filter(Boolean);

    let players = eighteenHoleEntries.map(entry => {
      const p = data.roster.find(r => r.id === entry.id);
      if(!p) return null;
      const tee = entry.tee || p.defaultTee || null;
      const ch = courseHandicapFor(p, tee);
      return { id: p.id, name: p.name, tee, courseHandicap: ch };
    }).filter(Boolean);

    if(players.length === 0 && nineHoleOut.length === 0) return null;

    const withCH = players.filter(x => x.courseHandicap !== null);
    const lowestCH = withCH.length ? Math.min(...withCH.map(x => x.courseHandicap)) : 0;
    players.forEach(p => {
      p.strokesOff = (p.courseHandicap !== null) ? (p.courseHandicap - lowestCH) : null;
    });

    const numTeams = confirmedTeeTimesCountFor(dateKey) || Math.max(1, Math.ceil(players.length / PLAYERS_PER_TEE_TIME));

    // Sort by strokes off descending (highest handicap first); anyone with no known
    // handicap goes last, in signup order among themselves.
    const sorted = [...players].sort((a, b) => {
      if(a.strokesOff === null && b.strokesOff === null) return 0;
      if(a.strokesOff === null) return 1;
      if(b.strokesOff === null) return -1;
      return b.strokesOff - a.strokesOff;
    });

    // Teams have to come out equal size — if the numbers don't divide evenly, whoever
    // signed up last (among the 18-hole players) sits out of the bet that day, same as
    // anyone playing nine holes. They can still play, just not part of the competition.
    const teamSize = Math.floor(sorted.length / numTeams);
    const usable = teamSize * numTeams;
    const oddOneOut = [];
    let eligible = sorted;
    if(usable < sorted.length){
      // Figure out who signed up last, among just the eligible 18-hole players.
      const signupOrder = eighteenHoleEntries.map(e => e.id);
      const bySignupOrder = [...sorted].sort((a, b) => signupOrder.indexOf(a.id) - signupOrder.indexOf(b.id));
      const cutCount = sorted.length - usable;
      const cut = bySignupOrder.slice(-cutCount);
      const cutIds = new Set(cut.map(p => p.id));
      cut.forEach(p => oddOneOut.push({ id: p.id, name: p.name, reason: 'Odd numbers — sitting out of the bet today' }));
      eligible = sorted.filter(p => !cutIds.has(p.id));
    }

    const teams = Array.from({ length: numTeams }, () => []);
    let teamIdx = 0, direction = 1;
    eligible.forEach(p => {
      teams[teamIdx].push(p);
      teamIdx += direction;
      if(teamIdx === numTeams){ teamIdx = numTeams - 1; direction = -1; }
      else if(teamIdx === -1){ teamIdx = 0; direction = 1; }
    });

    return { teams, notInBet: [...nineHoleOut, ...oddOneOut], generatedAt: new Date().toISOString() };
  }

  function confirmedTeeTimesCountFor(dateKey){
    const n = data.confirmedTeeTimes[dateKey];
    return (typeof n === 'number' && n > 0) ? n : null;
  }

  async function generateTeamsForNextPlayDay(){
    const schedule = buildSchedule();
    const nextDate = schedule.find(d => !data.closures[fmtDateKey(d)]);
    if(!nextDate) return null;
    const key = fmtDateKey(nextDate);
    const result = computeTeamsForDate(key);
    if(!result) return null;
    data.teams[key] = result;
    await saveData();
    return key;
  }

  // ---------------------------------------------------------------------------
  // SCORING & BETTING — hole-by-hole scores for the teams above, settled as
  // NUM_SERIES series of HOLES_PER_SERIES holes each, $stakePerSeries a series.
  // Strokes are allocated hole-by-hole using the course's hole handicap (stroke
  // index) — a player with N strokes off gets a stroke on the N hardest holes
  // (rank 1..N); if N > 18, every hole gets a base stroke plus one more on the
  // (N-18) hardest. That needs all 18 holes' ranks entered on the Handicaps tab
  // (holeHandicapsComplete()) — until then, strokes fall back to being split as
  // evenly as possible across the 3 series instead of by hole.
  // A team's net for a series is the sum of its players' net scores for that
  // series' 6 holes; every team is guaranteed the same size by the team
  // generator above, so that sum is a fair comparison. Every pair of teams is
  // its own $stakePerSeries bet each series (round-robin), low net wins, ties push.
  // ---------------------------------------------------------------------------

  function seriesHoleGroups(startHole){
    const start = (typeof startHole === 'number' && startHole >= 1 && startHole <= 18) ? startHole : 1;
    const order = Array.from({ length: 18 }, (_, i) => ((start - 1 + i) % 18) + 1);
    const groups = [];
    for(let s = 0; s < NUM_SERIES; s++) groups.push(order.slice(s * HOLES_PER_SERIES, s * HOLES_PER_SERIES + HOLES_PER_SERIES));
    return groups;
  }

  // True once all 18 holes have a rank entered and those ranks are exactly a
  // permutation of 1..18 (each hole a distinct difficulty rank, 1 = hardest).
  function holeHandicapsComplete(){
    const hh = data.holeHandicaps || {};
    const ranks = [];
    for(let h = 1; h <= 18; h++){
      const r = hh[String(h)];
      if(typeof r !== 'number') return false;
      ranks.push(r);
    }
    const sorted = [...ranks].sort((a, b) => a - b);
    for(let i = 0; i < 18; i++){ if(sorted[i] !== i + 1) return false; }
    return true;
  }

  // How many strokes a player with this many strokes-off gets on one specific
  // hole, using the standard allocation: a stroke on every hole ranked 1..N
  // (rank 1 = hardest); if N > 18, every hole gets one stroke plus a second on
  // the (N-18) hardest. Only meaningful once holeHandicapsComplete() is true.
  function strokesReceivedOnHole(strokesOff, holeNum){
    const rank = (data.holeHandicaps || {})[String(holeNum)];
    if(typeof rank !== 'number') return 0;
    const so = typeof strokesOff === 'number' && strokesOff > 0 ? strokesOff : 0;
    const full = Math.floor(so / 18);
    const remainder = so - full * 18;
    return full + (rank <= remainder ? 1 : 0);
  }

  // Fallback used only when holeHandicapsComplete() is false: splits a
  // player's round-long strokes off as evenly as possible across the 3
  // series, front-loading any remainder onto the earlier ones.
  function strokesForSeries(strokesOff){
    const so = typeof strokesOff === 'number' && strokesOff > 0 ? strokesOff : 0;
    const base = Math.floor(so / NUM_SERIES);
    const remainder = so - base * NUM_SERIES;
    return Array.from({ length: NUM_SERIES }, (_, i) => base + (i < remainder ? 1 : 0));
  }

  function ensureRoundDefaults(dateKey){
    if(!data.rounds[dateKey]) data.rounds[dateKey] = { startHole: 1, stakePerSeries: 1, scores: {} };
    if(!data.rounds[dateKey].scores) data.rounds[dateKey].scores = {};
    if(typeof data.rounds[dateKey].startHole !== 'number') data.rounds[dateKey].startHole = 1;
    if(typeof data.rounds[dateKey].stakePerSeries !== 'number') data.rounds[dateKey].stakePerSeries = 1;
    return data.rounds[dateKey];
  }

  // For each team and series: whether every player on the team has all 6
  // holes entered, and if so, the team's net total for that series. Then
  // every team-pair's result per series, and each team's running $ total.
  function computeSeriesStandings(dateKey){
    const teamsInfo = data.teams[dateKey];
    const round = data.rounds[dateKey];
    if(!teamsInfo || !round) return null;
    const groups = seriesHoleGroups(round.startHole);
    const scores = round.scores || {};
    const stake = round.stakePerSeries;
    const exact = holeHandicapsComplete();

    const teamSeriesNet = teamsInfo.teams.map(team => {
      return groups.map((holes, si) => {
        let complete = true;
        let net = 0;
        team.forEach(p => {
          const playerScores = scores[p.id] || {};
          let gross = 0;
          let strokes = 0;
          holes.forEach(h => {
            const v = playerScores[String(h)];
            if(typeof v !== 'number'){ complete = false; }
            else gross += v;
            if(exact) strokes += strokesReceivedOnHole(p.strokesOff, h);
          });
          if(!exact) strokes = strokesForSeries(p.strokesOff)[si];
          net += gross - strokes;
        });
        return { complete, net };
      });
    });

    const numTeams = teamsInfo.teams.length;
    const matchups = [];
    for(let si = 0; si < NUM_SERIES; si++){
      for(let a = 0; a < numTeams; a++){
        for(let b = a + 1; b < numTeams; b++){
          const A = teamSeriesNet[a][si], B = teamSeriesNet[b][si];
          let result = null;
          if(A.complete && B.complete){
            if(A.net < B.net) result = 'A';
            else if(B.net < A.net) result = 'B';
            else result = 'push';
          }
          matchups.push({ seriesIndex: si, teamA: a, teamB: b, aNet: A.complete ? A.net : null, bNet: B.complete ? B.net : null, result });
        }
      }
    }

    const teamTotals = Array.from({ length: numTeams }, () => 0);
    matchups.forEach(m => {
      if(m.result === 'A'){ teamTotals[m.teamA] += stake; teamTotals[m.teamB] -= stake; }
      else if(m.result === 'B'){ teamTotals[m.teamB] += stake; teamTotals[m.teamA] -= stake; }
    });

    return { groups, teamSeriesNet, matchups, teamTotals, stake, exact };
  }

  function fmtMoney(n){
    const sign = n < 0 ? '-' : '';
    return `${sign}$${Math.abs(n)}`;
  }

  // Compares this app's current data against a pasted snapshot from the other app,
  // and reports differences without changing anything. Comparisons go by player NAME
  // (not id) since the same real person can end up with different ids in each app —
  // e.g. one added manually here, imported with a different id there.
  function nameById(roster, id){
    const p = roster.find(r => r.id === id);
    return p ? p.name : null;
  }

  function diffDataSnapshots(cur, inc){
    const diffs = [];
    const incRoster = inc.roster || [];
    const incSignups = inc.signups || {};
    const incDuty = inc.duty || {};
    const incClosures = inc.closures || {};
    const incConfirmed = inc.confirmedTeeTimes || {};
    const incTeeTimes = inc.teeTimeSchedule || {};

    function findHereByName(name){
      return cur.roster.find(r => r.name.trim().toLowerCase() === name.trim().toLowerCase());
    }

    // Roster: in pasted but not here — option to add
    incRoster.forEach(p => {
      const name = typeof p === 'object' ? p.name : p;
      const email = typeof p === 'object' ? p.email : undefined;
      if(!name || findHereByName(name)) return;
      diffs.push({
        id: 'roster-add-' + name,
        category: 'League roster',
        label: `${name} is in the pasted data but not here`,
        hereLabel: 'Leave out',
        pastedLabel: `Add "${name}"${email ? ' (' + email + ')' : ''}`,
        apply: (d) => {
          const id = 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
          const entry = { id, name };
          if(email) entry.email = email;
          d.roster.push(entry);
        }
      });
    });

    // Roster: here but not in pasted — option to remove
    cur.roster.forEach(p => {
      const existsThere = incRoster.some(q => (typeof q === 'object' ? q.name : q).trim().toLowerCase() === p.name.trim().toLowerCase());
      if(existsThere) return;
      diffs.push({
        id: 'roster-remove-' + p.id,
        category: 'League roster',
        label: `${p.name} is here but not in the pasted data`,
        hereLabel: `Keep "${p.name}"`,
        pastedLabel: `Remove "${p.name}"`,
        apply: (d) => { d.roster = d.roster.filter(x => x.id !== p.id); }
      });
    });

    // Roster: email differences
    cur.roster.forEach(p => {
      const match = incRoster.find(q => typeof q === 'object' && q.name.trim().toLowerCase() === p.name.trim().toLowerCase());
      if(!match) return;
      const a = p.email || '', b = match.email || '';
      if(a === b) return;
      diffs.push({
        id: 'roster-email-' + p.id,
        category: 'League roster',
        label: `${p.name}'s email differs`,
        hereLabel: `Keep "${a || '(none)'}"`,
        pastedLabel: `Use "${b || '(none)'}"`,
        apply: (d) => {
          const player = d.roster.find(x => x.id === p.id);
          if(player){ if(b) player.email = b; else delete player.email; }
        }
      });
    });

    // Signups: per date, per player
    const allDates = new Set([...Object.keys(cur.signups || {}), ...Object.keys(incSignups)]);
    [...allDates].sort().forEach(date => {
      const curEntries = cur.signups[date] || [];
      const incEntries = incSignups[date] || [];
      const curByName = {}; curEntries.forEach(e => { const n = nameById(cur.roster, e.id); if(n) curByName[n] = e; });
      const incByName = {}; incEntries.forEach(e => { const n = nameById(incRoster, e.id); if(n) incByName[n] = e; });

      Object.keys(incByName).forEach(name => {
        if(curByName[name]) return;
        diffs.push({
          id: `signup-add-${date}-${name}`,
          category: 'Signups',
          label: `${name} — ${date} (signed up in pasted data)`,
          hereLabel: 'Not signed up',
          pastedLabel: `Add to ${date}`,
          apply: (d) => {
            const player = findHereByName(name) || d.roster.find(r => r.name.trim().toLowerCase() === name.trim().toLowerCase());
            if(!player) return;
            if(!d.signups[date]) d.signups[date] = [];
            if(!d.signups[date].some(e => e.id === player.id)){
              d.signups[date].push({ id: player.id, holes: incByName[name].holes || '18' });
            }
          }
        });
      });

      Object.keys(curByName).forEach(name => {
        if(incByName[name]) return;
        diffs.push({
          id: `signup-remove-${date}-${name}`,
          category: 'Signups',
          label: `${name} — ${date} (signed up here only)`,
          hereLabel: `Keep signed up`,
          pastedLabel: `Remove from ${date}`,
          apply: (d) => {
            if(d.signups[date]) d.signups[date] = d.signups[date].filter(e => e.id !== curByName[name].id);
          }
        });
      });
    });

    // Booking duty per date
    const allDutyDates = new Set([...Object.keys(cur.duty || {}), ...Object.keys(incDuty)]);
    [...allDutyDates].sort().forEach(date => {
      const curName = nameById(cur.roster, cur.duty[date]);
      const incName = nameById(incRoster, incDuty[date]);
      if((curName || null) === (incName || null)) return;
      diffs.push({
        id: `duty-${date}`,
        category: 'Booking duty',
        label: `Duty for ${date}`,
        hereLabel: curName || 'Unassigned',
        pastedLabel: incName || 'Unassigned',
        apply: (d) => {
          if(incName){
            const player = findHereByName(incName);
            if(player) d.duty[date] = player.id; else delete d.duty[date];
          } else {
            delete d.duty[date];
          }
        }
      });
    });

    // Course closures per date
    const allClosureDates = new Set([...Object.keys(cur.closures || {}), ...Object.keys(incClosures)]);
    [...allClosureDates].sort().forEach(date => {
      const a = cur.closures[date], b = incClosures[date];
      if((a || null) === (b || null)) return;
      diffs.push({
        id: `closure-${date}`,
        category: 'Course closures',
        label: `Closure status for ${date}`,
        hereLabel: a ? 'Closed' + (a.trim() ? ' — ' + a : '') : 'Open',
        pastedLabel: b ? 'Closed' + (b.trim() ? ' — ' + b : '') : 'Open',
        apply: (d) => { if(b){ d.closures[date] = b; } else { delete d.closures[date]; } }
      });
    });

    // Confirmed tee times per date
    const allConfirmDates = new Set([...Object.keys(cur.confirmedTeeTimes || {}), ...Object.keys(incConfirmed)]);
    [...allConfirmDates].sort().forEach(date => {
      const a = cur.confirmedTeeTimes[date], b = incConfirmed[date];
      if((a || null) === (b || null)) return;
      diffs.push({
        id: `confirmed-${date}`,
        category: 'Confirmed tee times',
        label: `Confirmed tee times for ${date}`,
        hereLabel: a ? String(a) : 'Not set',
        pastedLabel: b ? String(b) : 'Not set',
        apply: (d) => { if(b){ d.confirmedTeeTimes[date] = b; } else { delete d.confirmedTeeTimes[date]; } }
      });
    });

    // First tee times schedule
    const allTeeTimeDates = new Set([...Object.keys(cur.teeTimeSchedule || {}), ...Object.keys(incTeeTimes)]);
    [...allTeeTimeDates].sort().forEach(date => {
      const a = cur.teeTimeSchedule[date], b = incTeeTimes[date];
      if((a || null) === (b || null)) return;
      diffs.push({
        id: `teetime-${date}`,
        category: 'First tee times',
        label: `Effective ${date}`,
        hereLabel: a || 'Not set',
        pastedLabel: b || 'Not set',
        apply: (d) => { if(b){ d.teeTimeSchedule[date] = b; } else { delete d.teeTimeSchedule[date]; } }
      });
    });

    return diffs;
  }

  function showReconcileModal(diffs){
    return new Promise(resolve => {
      const modalRoot = document.getElementById('ts-modal-root');
      const selections = {};
      diffs.forEach(d => { selections[d.id] = 'here'; });

      const categories = [...new Set(diffs.map(d => d.category))];

      function rowsHtml(){
        return categories.map(cat => {
          const rows = diffs.filter(d => d.category === cat).map(d => `
            <div class="ts-reconcile-row">
              <div class="ts-reconcile-label">${esc(d.label)}</div>
              <div class="ts-reconcile-choices">
                <button class="ts-reconcile-choice ${selections[d.id]==='here'?'selected':''}" data-diff-id="${d.id}" data-choice="here">${esc(d.hereLabel)}</button>
                <button class="ts-reconcile-choice ${selections[d.id]==='pasted'?'selected':''}" data-diff-id="${d.id}" data-choice="pasted">${esc(d.pastedLabel)}</button>
              </div>
            </div>`).join('');
          return `<div class="ts-preview-email"><div class="ts-preview-meta"><b>${esc(cat)}</b></div>${rows}</div>`;
        }).join('');
      }

      function wireRows(){
        document.querySelectorAll('.ts-reconcile-choice').forEach(btn => {
          btn.onclick = () => {
            selections[btn.getAttribute('data-diff-id')] = btn.getAttribute('data-choice');
            document.getElementById('ts-preview-scroll-inner').innerHTML = rowsHtml();
            wireRows();
          };
        });
      }

      modalRoot.innerHTML = `
        <div class="ts-modal-overlay" id="ts-modal-overlay">
          <div class="ts-modal-box ts-modal-box-wide ts-modal-box-tall">
            <h4>Reconcile differences</h4>
            <p>For each item, pick which version to keep. Nothing changes until you click Apply.</p>
            <div class="ts-preview-scroll" id="ts-preview-scroll-inner">${rowsHtml()}</div>
            <div class="ts-modal-actions">
              <button class="ts-modal-cancel" id="ts-modal-cancel">Cancel</button>
              <button class="ts-modal-ok" id="ts-modal-apply">Apply Selected Changes</button>
            </div>
          </div>
        </div>`;
      wireRows();

      const cleanup = (val) => { modalRoot.innerHTML = ''; resolve(val); };
      document.getElementById('ts-modal-cancel').onclick = () => cleanup(false);
      document.getElementById('ts-modal-apply').onclick = () => {
        let applied = 0;
        diffs.forEach(d => { if(selections[d.id] === 'pasted'){ d.apply(data); applied++; } });
        cleanup(applied);
      };
      document.getElementById('ts-modal-overlay').addEventListener('click', (e) => {
        if(e.target.id === 'ts-modal-overlay') cleanup(false);
      });
    });
  }

  async function compareWithPasted(){
    const pasted = await askLongText('Compare with other app', 'Paste a snapshot exported from the other app (test or live) — you\'ll get to choose which version to keep for each difference before anything changes.');
    if(pasted === null) return;
    const trimmed = pasted.trim();
    if(!trimmed) return;
    let incoming;
    try{ incoming = JSON.parse(trimmed); }
    catch(e){ await showMessage('Compare failed', "That doesn't look like a valid snapshot — make sure you copied the whole thing."); return; }
    const diffs = diffDataSnapshots(data, incoming);
    if(diffs.length === 0){
      await showMessage('No differences', 'This app and the pasted data match exactly.');
      return;
    }
    const result = await showReconcileModal(diffs);
    if(result === false) return;
    await saveData();
    render();
    await showMessage('Reconciled', `Applied ${result} change${result===1?'':'s'} from the pasted data.`);
  }

  // Builds the Sunday weekly summary email: this week's booking duty, the next three
  // weeks of signups, and open-slot counts for this week — matching the admin's own
  // template. Arrival time is computed automatically from the First tee times schedule.
  async function buildWeeklySummaryEmail(){
    const schedule = buildSchedule();
    if(schedule.length < 9) return null;

    const thisWeek = schedule.slice(0, 3);
    const arrivalTime = arrivalTimeFor(fmtDateKey(thisWeek[0])) || 'time TBD — check with the pro shop';

    const nextThreeWeeks = schedule.slice(0, 9);
    const FULL_MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const dowFull = (d) => ({0:'Sunday',1:'Monday',2:'Tuesday',3:'Wednesday',4:'Thursday',5:'Friday',6:'Saturday'})[d.getDay()];

    const td = 'style="border:none;padding:5px 9px;font-family:Calibri,Arial,sans-serif;font-size:11pt;"';
    const th = 'style="border:none;border-bottom:2px solid #333;padding:5px 9px;font-family:Calibri,Arial,sans-serif;font-size:11pt;font-weight:bold;"';
    const tdY = 'style="border:none;padding:5px 9px;font-family:Calibri,Arial,sans-serif;font-size:11pt;background-color:#FFFF00;"';
    const thY = 'style="border:none;border-bottom:2px solid #333;padding:5px 9px;font-family:Calibri,Arial,sans-serif;font-size:11pt;font-weight:bold;background-color:#FFFF00;"';
    const tableOpen = '<table style="border-collapse:collapse;margin:8px 0;">';

    // Tee time duties table
    let dutyRows = '';
    thisWeek.forEach(d => {
      const key = fmtDateKey(d);
      const dateLabel = `${d.getDate()}-${MON_NAMES[d.getMonth()]}`;
      let dutyText;
      if(data.closures[key]){
        dutyText = 'Club Closed';
      } else {
        const target = new Date(d); target.setDate(target.getDate() + BOOKING_WINDOW_DAYS);
        const targetKey = fmtDateKey(target);
        const targetDuty = dutyForKey(targetKey);
        const targetCount = (data.signups[targetKey] || []).length;
        const targetTT = targetCount > 0 ? Math.ceil(targetCount/PLAYERS_PER_TEE_TIME) : 0;
        dutyText = targetDuty ? `${esc(firstNameOf(targetDuty.name))} - Get ${targetTT} tee time${targetTT===1?'':'s'} for ${FULL_MONTHS[target.getMonth()]} ${target.getDate()}` : 'Unassigned';
      }
      dutyRows += `<tr><td ${td}>${dateLabel}</td><td ${td}>${dowFull(d)}</td><td ${td}>${dutyText}</td></tr>`;
    });
    const dutyTable = `${tableOpen}<tr><th ${th}>Date</th><th ${th}>Weekday</th><th ${th}>Tee Time Duties (arrive at club at ${esc(arrivalTime)})</th></tr>${dutyRows}</table>`;

    // Signup tables — one per week, third week highlighted yellow
    let weekTables = '';
    for(let w = 0; w < 3; w++){
      const isThird = w === 2;
      const cellStyle = isThird ? tdY : td;
      const headStyle = isThird ? thY : th;
      const weekDates = nextThreeWeeks.slice(w*3, w*3+3);
      const weekStart = weekDates[0];
      let rows = '';
      weekDates.forEach(d => {
        const key = fmtDateKey(d);
        const dateLabel = `${d.getDate()}-${MON_NAMES[d.getMonth()]}`;
        if(data.closures[key]){
          rows += `<tr><td ${cellStyle}>${dateLabel}</td><td ${cellStyle}>${dowFull(d)}</td><td ${cellStyle}>-</td><td ${cellStyle}>Club Closed</td></tr>`;
          return;
        }
        const entries = data.signups[key] || [];
        const capacity = capacityFor(key);
        const { confirmed } = splitConfirmedStandby(entries, capacity);
        const list = capacity != null ? confirmed : entries;
        const names = list
          .map(e => data.roster.find(p => p.id === e.id))
          .filter(Boolean)
          .sort((a,b) => lastNameOf(a.name).localeCompare(lastNameOf(b.name)))
          .map(p => esc(lastNameOf(p.name)));
        rows += `<tr><td ${cellStyle}>${dateLabel}</td><td ${cellStyle}>${dowFull(d)}</td><td ${cellStyle}>${list.length}</td><td ${cellStyle}>${names.join(', ')}</td></tr>`;
      });
      weekTables += `${tableOpen}<tr><th ${headStyle}>Date</th><th ${headStyle}>Weekday</th><th ${headStyle}>#</th><th ${headStyle}>Players signed up for the week of ${FULL_MONTHS[weekStart.getMonth()]} ${weekStart.getDate()}</th></tr>${rows}</table>`;
    }

    // Open slots for this week
    let openSlotItems = '';
    thisWeek.forEach(d => {
      const key = fmtDateKey(d);
      let line;
      if(data.closures[key]) line = `Club is closed on ${dowFull(d)}`;
      else {
        const capacity = capacityFor(key);
        if(capacity == null) line = `Tee times not yet confirmed for ${dowFull(d)}`;
        else {
          const entries = data.signups[key] || [];
          const { confirmed } = splitConfirmedStandby(entries, capacity);
          const open = capacity - confirmed.length;
          line = open <= 0 ? `No slots open on ${dowFull(d)}` : (open === 1 ? `One slot open on ${dowFull(d)}` : `${open} slots open on ${dowFull(d)}`);
        }
      }
      openSlotItems += `<li>${line}</li>`;
    });

    const thirdWeekStart = nextThreeWeeks[6];
    const pStyle = 'style="font-family:Calibri,Arial,sans-serif;font-size:11pt;"';

    const body = [
      `<p ${pStyle}>Gentlemen:</p>`,
      `<p ${pStyle}>Here are the tee time duties for next week:</p>`,
      dutyTable,
      `<p ${pStyle}>Here's who has signed up to play over the next three weeks:</p>`,
      weekTables,
      `<p ${pStyle}>Let John, Geoff and me know as soon as possible if your schedule is incorrect, especially for the third week out (${FULL_MONTHS[thirdWeekStart.getMonth()]} ${thirdWeekStart.getDate()}<sup>th</sup> highlighted in yellow above), so those heading to the club early do not book tee times that go unused.</p>`,
      `<p ${pStyle}>Regarding open slots this coming week:</p>`,
      `<ul ${pStyle}>${openSlotItems}</ul>`,
      `<p ${pStyle}>If your plans change on very short notice, please text or email John, Geoff, Red and me (all four of us please) if you can. That includes deciding to play nine holes or to not play because of cart-paths-only. It helps whoever is trying to set up the match.</p>`,
      `<p ${pStyle}>Thanks.</p>`
    ].join('');

    const recipients = data.roster.filter(p => p.email).map(p => p.email);
    const weekLabel = `${MON_NAMES[thisWeek[0].getMonth()]} ${thisWeek[0].getDate()}`;

    return {
      cc: recipients.join(','),
      subject: `Weekly Tee Time Summary — week of ${weekLabel}`,
      body,
      isHtml: 'true'
    };
  }

  async function prepareWeeklySummary(){
    const row = await buildWeeklySummaryEmail();
    if(!row) return;
    if(!row.cc){
      await showMessage('No recipients', 'No players have an email on file yet.');
      return;
    }
    const approved = await showPreviewModal('Review weekly summary', [row]);
    if(!approved) return;
    const csv = toCSV([row]);
    const stamp = new Date().toISOString().slice(0,10);
    await showExportModal(
      'Weekly summary ready',
      'Download this CSV and point your Sunday scheduled script at it.',
      csv,
      `weekly-summary-${stamp}.csv`,
      'text/csv'
    );
  }

  function toCSV(rows){
    const escCsv = (s) => '"' + String(s).replace(/"/g, '""') + '"';
    const header = 'cc,subject,body,isHtml';
    const lines = rows.map(r => [r.cc, r.subject, r.body, r.isHtml || 'false'].map(escCsv).join(','));
    return [header, ...lines].join('\r\n');
  }
